<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetalMap - Discover Metal Artists Worldwide</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a14;
            color: #e6e6fa;
            font-family: 'Segoe UI', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Top Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(106, 13, 173, 0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
        }

        .main-text {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #9d4edd;
            text-shadow: 0 0 15px rgba(157, 78, 221, 0.7);
            animation: textGlow 4s ease-in-out infinite alternate;
        }

        .powered-by {
            font-size: 0.7rem;
            color: #d4af37;
            margin-top: -2px;
            letter-spacing: 0.05em;
        }

        .powered-by a {
            color: #9d4edd;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .powered-by a:hover {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Right Sidebar */
        .sidebar {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 350px;
            z-index: 999;
            background: rgba(20, 10, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(106, 13, 173, 0.3);
            padding: 20px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .search-section {
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            background: rgba(30, 15, 45, 0.8);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 5px;
            color: #e6e6fa;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .search-box:focus {
            outline: none;
            border-color: #9d4edd;
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.3);
        }

        .selected-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: rgba(106, 13, 173, 0.3);
            color: #d4af37;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tag-remove {
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            padding-left: 5px;
        }

        .tag-remove:hover {
            color: #ff6b6b;
        }

        .autocomplete-container {
            position: relative;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(30, 15, 45, 0.95);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .autocomplete-item {
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .autocomplete-item:hover {
            background: rgba(157, 78, 221, 0.2);
        }

        .search-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6a0dad, #9d4edd);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .search-btn:hover {
            background: linear-gradient(135deg, #9d4edd, #6a0dad);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
        }

        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .artists-header {
            margin-bottom: 20px;
            color: #9d4edd;
            font-size: 1.3rem;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(157, 78, 221, 0.3);
        }

        .country-name {
            color: #d4af37;
        }

        .artist-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .artist-card {
            background: rgba(30, 15, 45, 0.8);
            border-left: 3px solid #9d4edd;
            padding: 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .artist-card:hover {
            background: rgba(45, 20, 65, 0.9);
            border-left-color: #d4af37;
            transform: translateX(5px);
        }

        .artist-name {
            color: #e6e6fa;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .artist-info {
            color: #b8a2d1;
            font-size: 0.85rem;
            margin-bottom: 3px;
        }

        .artist-tags {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .artist-tag {
            background: rgba(106, 13, 173, 0.3);
            color: #d4af37;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #b8a2d1;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #ff6b6b;
        }

        .no-artists {
            text-align: center;
            padding: 30px;
            color: #b8a2d1;
        }

        /* Full Screen Map */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Custom Map Styling */
        .leaflet-container {
            background: #0a0a14 !important;
        }

        .country-marker {
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid #9d4edd;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .country-marker:hover {
            background: rgba(157, 78, 221, 0.4);
            transform: scale(1.1);
        }

        .country-marker.selected {
            background: rgba(212, 175, 55, 0.4);
            border-color: #d4af37;
            transform: scale(1.2);
        }

        /* Background elements */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(106, 13, 173, 0.03) 0%, rgba(106, 13, 173, 0) 70%);
            z-index: -1;
        }

        /* Animations */
        @keyframes textGlow {
            0% {
                text-shadow: 0 0 10px rgba(157, 78, 221, 0.5);
            }
            100% {
                text-shadow: 0 0 20px rgba(157, 78, 221, 0.8), 0 0 30px rgba(157, 78, 221, 0.4);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.1;
            }
            33% {
                transform: translate(30px, -20px) scale(1.05);
                opacity: 0.15;
            }
            66% {
                transform: translate(-20px, 15px) scale(0.95);
                opacity: 0.08;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 300px;
                right: 10px;
            }
            
            .header {
                padding: 8px 15px;
            }
            
            .main-text {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo-container">
            <div class="main-text">MetalMap</div>
            <div class="powered-by">powered by <a href="https://jklm.gay" target="_blank">jklm.gay</a></div>
        </div>
        <div style="color: #b8a2d1; font-size: 0.9rem;">
            Click any country to discover metal artists
        </div>
    </div>

    <!-- Right Sidebar -->
    <div class="sidebar">
        <div class="search-section">
            <div class="autocomplete-container">
                <input type="text" 
                       class="search-box" 
                       id="genreSearch" 
                       placeholder="Type to search metal genres (death metal, black metal, etc.)"
                       autocomplete="off">
                <div class="autocomplete-list" id="autocompleteList"></div>
            </div>
            <div class="selected-tags" id="selectedTags"></div>
            <button class="search-btn" id="searchBtn" disabled>
                Search Artists in Selected Country
            </button>
        </div>

        <div class="artists-header">
            Artists from <span class="country-name" id="selectedCountry">No country selected</span>
        </div>
        <div id="artistsList" class="artist-list">
            <div class="loading">Select a country on the map to begin</div>
        </div>
    </div>

    <!-- Full Screen Map -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>

        // Create animated background elements
        function createBackground() {
            const body = document.body;
            
            for (let i = 0; i < 6; i++) {
                const circle = document.createElement('div');
                circle.classList.add('bg-element');
                
                const size = Math.random() * 300 + 200;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                circle.style.left = `${x}%`;
                circle.style.top = `${y}%`;
                
                const duration = Math.random() * 40 + 20;
                circle.style.animation = `float ${duration}s ease-in-out infinite`;
                
                body.appendChild(circle);
            }
        }

        // Load country code mapping from flagcdn
        async function loadCountryCodeMapping() {
            try {
                const response = await fetch('https://flagcdn.com/en/codes.json');
                const data = await response.json();
                
                // Create both mappings
                for (const [code, name] of Object.entries(data)) {
                    const upperCode = code.toUpperCase();
                    countryCodeMap[name.toLowerCase()] = upperCode;
                    codeToNameMap[upperCode] = name;
                }
                
                console.log('Loaded country code mapping for', Object.keys(data).length, 'countries');
                
            } catch (error) {
                console.error('Error loading country codes:', error);
                // Fallback to hardcoded mapping
                const fallbackMapping = {
                    'united states': 'US',
                    'united kingdom': 'GB',
                    'germany': 'DE',
                    'sweden': 'SE',
                    'finland': 'FI',
                    'norway': 'NO',
                    'japan': 'JP',
                    'brazil': 'BR',
                    'australia': 'AU',
                    'canada': 'CA',
                    'france': 'FR',
                    'italy': 'IT',
                    'spain': 'ES',
                    'poland': 'PL',
                    'netherlands': 'NL',
                    'russia': 'RU',
                    'mexico': 'MX',
                    'argentina': 'AR',
                    'switzerland': 'CH',
                    'austria': 'AT'
                };
                
                for (const [name, code] of Object.entries(fallbackMapping)) {
                    countryCodeMap[name.toLowerCase()] = code;
                    codeToNameMap[code] = name;
                }
            }
        }

        // Get country code from name
        function getCountryCode(countryName) {
            return countryCodeMap[countryName.toLowerCase()] || null;
        }

        // Initialize genre search with autocomplete
        function initGenreSearch() {
            const searchBox = document.getElementById('genreSearch');
            const autocompleteList = document.getElementById('autocompleteList');
            const selectedTagsContainer = document.getElementById('selectedTags');
            const searchBtn = document.getElementById('searchBtn');

            // Update search button state
            function updateSearchButton() {
                searchBtn.disabled = !selectedCountry || selectedGenres.size === 0;
                searchBtn.textContent = selectedCountry 
                    ? `Search ${selectedGenres.size} genre${selectedGenres.size > 1 ? 's' : ''} in ${selectedCountry.name}`
                    : 'Search Artists in Selected Country';
            }

            // Add genre tag
            function addGenreTag(genre) {
                if (selectedGenres.has(genre)) return;
                
                selectedGenres.add(genre);
                
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerHTML = `
                    ${genre}
                    <span class="tag-remove" data-genre="${genre}">&times;</span>
                `;
                
                selectedTagsContainer.appendChild(tag);
                
                // Add remove functionality
                tag.querySelector('.tag-remove').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const genreToRemove = this.dataset.genre;
                    selectedGenres.delete(genreToRemove);
                    tag.remove();
                    updateSearchButton();
                });
                
                updateSearchButton();
            }

            // Show autocomplete suggestions
            function showSuggestions(input) {
                if (!input) {
                    autocompleteList.style.display = 'none';
                    return;
                }
                
                const suggestions = metalGenres.filter(genre => 
                    genre.toLowerCase().includes(input.toLowerCase()) && 
                    !selectedGenres.has(genre)
                );
                
                if (suggestions.length === 0) {
                    autocompleteList.style.display = 'none';
                    return;
                }
                
                autocompleteList.innerHTML = suggestions
                    .map(genre => `<div class="autocomplete-item" data-genre="${genre}">${genre}</div>`)
                    .join('');
                
                autocompleteList.style.display = 'block';
                
                // Add click handlers to suggestions
                autocompleteList.querySelectorAll('.autocomplete-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const genre = this.dataset.genre;
                        addGenreTag(genre);
                        searchBox.value = '';
                        autocompleteList.style.display = 'none';
                    });
                });
            }

            // Search box event listeners
            searchBox.addEventListener('input', function() {
                showSuggestions(this.value);
            });

            searchBox.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && this.value.trim()) {
                    const genre = this.value.trim().toLowerCase();
                    if (metalGenres.includes(genre) && !selectedGenres.has(genre)) {
                        addGenreTag(genre);
                        this.value = '';
                        autocompleteList.style.display = 'none';
                    }
                }
            });

            // Hide autocomplete when clicking outside
            document.addEventListener('click', function(e) {
                if (!searchBox.contains(e.target) && !autocompleteList.contains(e.target)) {
                    autocompleteList.style.display = 'none';
                }
            });

            // Search button click handler
            searchBtn.addEventListener('click', function() {
                if (!selectedCountry || selectedGenres.size === 0) return;
                fetchArtists(selectedCountry.code, selectedCountry.name);
            });

            // Initialize with some default genres
            ['death metal', 'black metal', 'thrash metal'].forEach(addGenreTag);
        }

        // Initialize the world map with Leaflet - SIMPLIFIED VERSION
        function initWorldMap() {
            // Create map with dark theme
            map = L.map('map', {
                zoomControl: true,
                zoomControlOptions: {
                    position: 'bottomright'
                },
                minZoom: 2,
                maxZoom: 8
            }).setView([20, 0], 2);

            // Add dark tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '©OpenStreetMap, ©CartoDB',
                maxZoom: 8
            }).addTo(map);

            // Create markers layer
            markersLayer = L.layerGroup().addTo(map);

            // Create country markers using predefined centroids
            createAllCountryMarkers();
        }

        // Create all country markers using stable centroids
        function createAllCountryMarkers() {
            const markerPromises = [];
            
            // Create markers for countries with predefined centroids
            for (const [code, centroid] of Object.entries(countryCentroids)) {
                const countryName = codeToNameMap[code];
                if (countryName) {
                    createCountryMarker(centroid, code, countryName);
                }
            }
            
            // Also create markers for additional countries from the mapping
            for (const [code, name] of Object.entries(codeToNameMap)) {
                if (!countryCentroids[code]) {
                    // For countries without predefined centroids, use a reasonable default
                    // based on the country's general region
                    const centroid = getRegionCentroid(code);
                    if (centroid) {
                        createCountryMarker(centroid, code, name);
                    }
                }
            }
            
            console.log('Created', markersLayer.getLayers().length, 'country markers');
        }

            return regionCentroids[countryCode] || null;
        }

        // Create a marker for a country
        function createCountryMarker(centroid, countryCode, countryName) {
            const marker = L.circleMarker(centroid, {
                radius: 6,
                fillColor: '#9d4edd',
                color: '#6a0dad',
                weight: 1,
                opacity: 0.7,
                fillOpacity: 0.3
            }).addTo(markersLayer);
            
            // Store country data
            marker.countryData = {
                code: countryCode,
                name: countryName
            };
            
            // Add click handler with debouncing
            let clickTimeout = null;
            marker.on('click', function() {
                if (clickTimeout) return;
                
                // Reset previously selected marker
                if (selectedMarker) {
                    selectedMarker.setStyle({
                        fillColor: '#9d4edd',
                        color: '#6a0dad',
                        weight: 1
                    });
                }
                
                // Style selected marker
                marker.setStyle({
                    fillColor: '#d4af37',
                    color: '#ffd700',
                    weight: 2
                });
                
                selectedMarker = marker;
                selectedCountry = marker.countryData;
                
                // Update UI
                document.getElementById('selectedCountry').textContent = countryName;
                document.getElementById('searchBtn').disabled = selectedGenres.size === 0;
                
                // Show initial artists for this country
                fetchArtists(countryCode, countryName);
                
                // Pan to country
                map.panTo(centroid, { animate: true, duration: 0.5 });
                
                // Set timeout to prevent rapid clicking
                clickTimeout = setTimeout(() => {
                    clickTimeout = null;
                }, 300);
            });
            
            // Add hover effect
            marker.on('mouseover', function() {
                if (marker !== selectedMarker) {
                    marker.setStyle({
                        fillOpacity: 0.5
                    });
                }
            });
            
            marker.on('mouseout', function() {
                if (marker !== selectedMarker) {
                    marker.setStyle({
                        fillOpacity: 0.3
                    });
                }
            });
            
            // Add tooltip
            marker.bindTooltip(countryName, {
                direction: 'top',
                offset: [0, -8],
                opacity: 0.9,
                className: 'country-tooltip'
            });
            
            return marker;
        }

        // Fetch artists from MusicBrainz API
        async function fetchArtists(countryCode, countryName) {
            const artistsList = document.getElementById('artistsList');
            artistsList.innerHTML = '<div class="loading">Searching for metal artists in ' + countryName + '...</div>';
            
            try {
                // Build query from selected genres
                const genreQueries = Array.from(selectedGenres).map(genre => `tag:"${genre}"`).join(' OR ');
                const query = `(${genreQueries}) AND country:${countryCode}`;
                const encodedQuery = encodeURIComponent(query);
                
                const url = `https://musicbrainz.org/ws/2/artist/?query=${encodedQuery}&limit=100&offset=0&fmt=json`;
                
                const response = await fetch(url, {
                    headers: {
                        'User-Agent': 'MetalMap/1.0 (https://jklm.gay)'
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                if (!data.artists || data.artists.length === 0) {
                    artistsList.innerHTML = '<div class="no-artists">No metal artists found for ' + countryName + ' with the selected genres.</div>';
                    return;
                }
                
                displayArtists(data.artists);
                
            } catch (error) {
                console.error('Error fetching artists:', error);
                artistsList.innerHTML = '<div class="error">Error loading artists. Please try again.</div>';
            }
        }

        // Display artists in the UI
        function displayArtists(artists) {
            const artistsList = document.getElementById('artistsList');
            const sortedArtists = [...artists].sort((a, b) => a.name.localeCompare(b.name));
            const displayArtists = sortedArtists.slice(0, 50);
            
            if (displayArtists.length === 0) {
                artistsList.innerHTML = '<div class="no-artists">No artists found with the selected criteria.</div>';
                return;
            }
            
            let html = '';
            
            displayArtists.forEach(artist => {
                let tags = [];
                if (artist.tags && artist.tags.length > 0) {
                    tags = artist.tags
                        .filter(tag => tag.count > 0)
                        .map(tag => tag.name)
                        .slice(0, 5);
                }
                
                let lifespan = '';
                if (artist['life-span']) {
                    const begin = artist['life-span'].begin || '?';
                    const end = artist['life-span'].ended ? (artist['life-span'].end || 'present') : 'present';
                    lifespan = `${begin} - ${end}`;
                }
                
                html += `
                    <div class="artist-card" data-artist-id="${artist.id}">
                        <div class="artist-name">${artist.name}</div>
                        ${lifespan ? `<div class="artist-info">${lifespan}</div>` : ''}
                        ${artist.disambiguation ? `<div class="artist-info">${artist.disambiguation}</div>` : ''}
                        ${tags.length > 0 ? `
                            <div class="artist-tags">
                                ${tags.map(tag => `<span class="artist-tag">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            
            artistsList.innerHTML = html;
            
            // Add click events to artist cards
            document.querySelectorAll('.artist-card').forEach(card => {
                card.addEventListener('click', function() {
                    const artistId = this.dataset.artistId;
                    window.open(`https://musicbrainz.org/artist/${artistId}`, '_blank');
                });
            });
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', async () => {
            createBackground();
            await loadCountryCodeMapping(); // Load country codes first
            initGenreSearch();
            initWorldMap();
            
            // Select United States by default after a short delay
            setTimeout(() => {
                if (map && countryCentroids.US) {
                    map.setView(countryCentroids.US, 3); // Center on US
                    
                    // Find and click the US marker
                    markersLayer.eachLayer(function(layer) {
                        if (layer.countryData && layer.countryData.code === 'US') {
                            layer.fire('click');
                        }
                    });
                }
            }, 1000);
        });
    </script>
