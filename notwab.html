<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batproxy - Sleek Proxy Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #e0e0e0;
            transition: background-image 0.5s ease-in-out;
            position: relative;
        }

        /* Background overlay for dimming effect */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.3) grayscale(100%) blur(8px);
            transition: background-image 0.5s ease-in-out;
            z-index: -1;
            transform: scale(1.1);
        }

        .background-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
            animation: slideDown 0.5s ease-out;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0a0a0a;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .bat {
            color: #a0a0a0;
            font-weight: 700;
        }

        .proxy {
            color: #ffffff;
            font-weight: 300;
        }

        .user-greeting {
            font-size: 1.1rem;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-flag {
            width: 24px;
            height: 18px;
            border-radius: 3px;
            object-fit: cover;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* API Key input section */
        .api-section {
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.6s ease-out;
        }

        .title-small {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 30px;
            text-align: center;
            color: #a0a0a0;
            letter-spacing: 1px;
        }

        .input-container {
            position: relative;
            margin-bottom: 20px;
        }

        .api-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(20, 20, 20, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: #ffffff;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            padding-right: 60px;
        }

        .api-input:focus {
            outline: none;
            border-color: #ffffff;
            background: rgba(30, 30, 30, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .api-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .verify-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .verify-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .verify-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out;
        }

        .status-message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #a0ffa0;
        }

        .status-message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ffa0a0;
        }

        .status-message.info {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
        }

        /* Proxy generator section */
        .generator-section {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.6s ease-out;
        }

        .info-card {
            background: rgba(20, 20, 20, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .info-title {
            color: #a0a0a0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .info-value {
            font-size: 2rem;
            font-weight: 300;
            color: #ffffff;
        }

        .info-subtitle {
            color: #808080;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .generate-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 20px 0;
        }

        .generate-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
        }

        .generate-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Proxy result */
        .proxy-result {
            padding: 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.5s ease-out;
        }

        .proxy-result h3 {
            color: #ffffff;
            font-weight: 300;
            margin-bottom: 25px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .proxy-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .proxy-detail-item {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .proxy-detail-label {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .proxy-detail-value {
            font-size: 1.8rem;
            font-weight: 300;
            color: #ffffff;
        }

        .ip-info {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ip-info-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .ip-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .ip-info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .ip-info-label {
            font-size: 0.7rem;
            color: #808080;
            letter-spacing: 0.5px;
        }

        .ip-info-value {
            font-size: 1rem;
            color: #ffffff;
        }

        .flag-image {
            width: 32px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .proxy-details {
                grid-template-columns: 1fr;
            }
            
            .ip-info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="background-overlay" id="backgroundOverlay"></div>
    
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🦇</div>
                <h1>
                    <span class="bat">bat</span><span class="proxy">proxy</span>
                </h1>
            </div>
            <div id="userGreeting" class="user-greeting" style="display: none;">
                <img id="userFlag" class="user-flag" src="" alt="">
                <span id="greetingText"></span>
            </div>
        </header>

        <main class="main-content">
            <!-- API Key Input Section -->
            <div id="apiSection" class="api-section">
                <div class="title-small">enter your API key</div>
                <div class="input-container">
                    <input type="text" id="apiKeyInput" class="api-input" placeholder="••••••••••••••••" autocomplete="off">
                    <button id="verifyButton" class="verify-button" onclick="verifyApiKey()">verify</button>
                </div>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <!-- Proxy Generator Section (Initially Hidden) -->
            <div id="generatorSection" class="generator-section" style="display: none;">
                <div class="info-card">
                    <div class="info-title">session duration</div>
                    <div class="info-value">6 hours</div>
                    <div class="info-subtitle">fixed duration for all sessions</div>
                </div>
                
                <button id="generateButton" class="generate-button" onclick="generateProxy()">
                    generate random proxy
                </button>
                
                <!-- Proxy Result (Initially Hidden) -->
                <div id="proxyResult" class="proxy-result" style="display: none;">
                    <h3>✅ proxy generated</h3>
                    <div class="proxy-details">
                        <div class="proxy-detail-item">
                            <div class="proxy-detail-label">port</div>
                            <div class="proxy-detail-value" id="proxyPort">-</div>
                        </div>
                        <div class="proxy-detail-item">
                            <div class="proxy-detail-label">ip address</div>
                            <div class="proxy-detail-value" id="proxyIp">-</div>
                        </div>
                    </div>
                    
                    <div class="ip-info" id="ipInfo" style="display: none;">
                        <div class="ip-info-header">
                            <span>📍 location details</span>
                            <img id="resultFlag" class="flag-image" src="" alt="">
                        </div>
                        <div class="ip-info-grid">
                            <div class="ip-info-item">
                                <span class="ip-info-label">country</span>
                                <span class="ip-info-value" id="resultCountry">-</span>
                            </div>
                            <div class="ip-info-item">
                                <span class="ip-info-label">city</span>
                                <span class="ip-info-value" id="resultCity">-</span>
                            </div>
                            <div class="ip-info-item">
                                <span class="ip-info-label">region</span>
                                <span class="ip-info-value" id="resultRegion">-</span>
                            </div>
                            <div class="ip-info-item">
                                <span class="ip-info-label">isp</span>
                                <span class="ip-info-value" id="resultIsp">-</span>
                            </div>
                            <div class="ip-info-item">
                                <span class="ip-info-label">asn</span>
                                <span class="ip-info-value" id="resultAsn">-</span>
                            </div>
                            <div class="ip-info-item">
                                <span class="ip-info-label">coordinates</span>
                                <span class="ip-info-value" id="resultCoords">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'https://corsproxy.io/?url=https://proxy-api-zeta.vercel.app';
        const CORS_PROXY = 'https://corsproxy.io/?url=';
        let userCountry = null;
        let username = 'user';
        let userCountryInfo = null;
        let countryImages = new Map();

        // Load country images from CSV
        async function loadCountryImages() {
            try {
                const response = await fetch(CORS_PROXY + encodeURIComponent('https://jklm.gay/list.csv'));
                const text = await response.text();
                const lines = text.split('\n');
                
                lines.forEach(line => {
                    const parts = line.split('\t');
                    if (parts.length >= 5) {
                        const countryName = parts[0].trim();
                        const countryCode = parts[1].trim();
                        const imageUrl = parts[4].trim();
                        countryImages.set(countryCode.toUpperCase(), imageUrl);
                        countryImages.set(countryName.toUpperCase(), imageUrl);
                    }
                });
                
                console.log('Loaded country images:', countryImages.size);
            } catch (error) {
                console.error('Error loading country images:', error);
            }
        }

        // Get user's country from IP using nyanc4tt API
        async function getUserCountry() {
            try {
                // Get user's IP first (using a simple IP API)
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const userIp = ipData.ip;
                
                // Then get location info
                const response = await fetch(`https://nyanc4tt.xyz/api/iplookup?ip=${userIp}`);
                const data = await response.json();
                
                userCountryInfo = data;
                userCountry = data.country_code;
                
                // Update greeting with flag
                const greetingEl = document.getElementById('userGreeting');
                const flagEl = document.getElementById('userFlag');
                const greetingText = document.getElementById('greetingText');
                
                flagEl.src = data.flag_image || '';
                flagEl.alt = data.country || '';
                greetingText.textContent = `Hi, ${username}`;
                greetingEl.style.display = 'flex';
                
                // Set background based on country
                updateBackground(userCountry);
                
                return data;
            } catch (error) {
                console.error('Error getting user country:', error);
                // Default background if country detection fails
                updateBackground('DEFAULT');
                
                // Still show greeting without flag
                const greetingEl = document.getElementById('userGreeting');
                const greetingText = document.getElementById('greetingText');
                greetingText.textContent = `Hi, ${username}`;
                greetingEl.style.display = 'flex';
                
                return null;
            }
        }

        // Update background image based on country
        function updateBackground(countryCode) {
            const overlay = document.getElementById('backgroundOverlay');
            let imageUrl = countryImages.get(countryCode?.toUpperCase());
            
            if (!imageUrl) {
                // Default to a random dark gradient if no country image
                overlay.style.backgroundImage = 'linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%)';
                return;
            }
            
            overlay.style.backgroundImage = `url('${imageUrl}')`;
        }

        // Check for saved API key in cookies
        function getSavedApiKey() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'batproxy_api_key') {
                    return value;
                }
            }
            return null;
        }

        // Save API key to cookie (30 days expiry)
        function saveApiKey(apiKey) {
            const date = new Date();
            date.setTime(date.getTime() + (30 * 24 * 60 * 60 * 1000));
            document.cookie = `batproxy_api_key=${apiKey}; expires=${date.toUTCString()}; path=/; SameSite=Strict`;
        }

        // Show status message
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }

        // Generate random port between 10000 and 49999
        function generateRandomPort() {
            return Math.floor(Math.random() * (49999 - 10000 + 1)) + 10000;
        }

        // Get IP location info
        async function getIpLocation(ip) {
            try {
                const response = await fetch(`https://nyanc4tt.xyz/api/iplookup?ip=${ip}`);
                return await response.json();
            } catch (error) {
                console.error('Error getting IP location:', error);
                return null;
            }
        }

        // Verify API key
        async function verifyApiKey() {
            const apiKeyInput = document.getElementById('apiKeyInput');
            const verifyButton = document.getElementById('verifyButton');
            const apiKey = apiKeyInput.value.trim();
            
            if (!apiKey) {
                showStatus('Please enter an API key', 'error');
                return;
            }
            
            // Show loading state
            verifyButton.disabled = true;
            verifyButton.innerHTML = '<span class="loading"></span>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/key/validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 'auth-key': apiKey })
                });
                
                const data = await response.json();
                
                if (data.valid) {
                    showStatus('✓ API key verified!', 'success');
                    saveApiKey(apiKey);
                    
                    // Show generator section
                    document.getElementById('apiSection').style.display = 'none';
                    document.getElementById('generatorSection').style.display = 'block';
                    
                    // Get user's country for background and greeting
                    await getUserCountry();
                } else {
                    showStatus('✗ Invalid API key', 'error');
                }
            } catch (error) {
                console.error('Error verifying API key:', error);
                showStatus('Error verifying API key. Please try again.', 'error');
            } finally {
                verifyButton.disabled = false;
                verifyButton.textContent = 'verify';
            }
        }

        // Generate proxy
        async function generateProxy() {
            const apiKey = getSavedApiKey();
            if (!apiKey) {
                showStatus('No API key found. Please verify your key again.', 'error');
                document.getElementById('generatorSection').style.display = 'none';
                document.getElementById('apiSection').style.display = 'block';
                return;
            }
            
            const port = generateRandomPort();
            const generateButton = document.getElementById('generateButton');
            
            // Show loading state
            generateButton.disabled = true;
            generateButton.textContent = 'generating...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey
                    },
                    body: JSON.stringify({
                        port: port,
                        countrycode: null, // Let API choose based on location
                        duration: 21600 // 6 hours in seconds
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Show basic proxy info
                    document.getElementById('proxyPort').textContent = data.port;
                    document.getElementById('proxyIp').textContent = data.ip;
                    
                    // Get and show IP location info
                    const ipInfo = await getIpLocation(data.ip);
                    if (ipInfo) {
                        document.getElementById('resultCountry').textContent = ipInfo.country || 'Unknown';
                        document.getElementById('resultCity').textContent = ipInfo.city || 'Unknown';
                        document.getElementById('resultRegion').textContent = ipInfo.region || 'Unknown';
                        document.getElementById('resultIsp').textContent = ipInfo.isp || 'Unknown';
                        document.getElementById('resultAsn').textContent = ipInfo.asn || 'Unknown';
                        document.getElementById('resultCoords').textContent = 
                            ipInfo.latitude && ipInfo.longitude ? 
                            `${ipInfo.latitude}, ${ipInfo.longitude}` : 'Unknown';
                        
                        const resultFlag = document.getElementById('resultFlag');
                        if (ipInfo.flag_image) {
                            resultFlag.src = ipInfo.flag_image;
                            resultFlag.style.display = 'inline-block';
                        }
                        
                        document.getElementById('ipInfo').style.display = 'block';
                        
                        // Update background based on proxy's country
                        if (ipInfo.country_code) {
                            updateBackground(ipInfo.country_code);
                        }
                    }
                    
                    document.getElementById('proxyResult').style.display = 'block';
                    
                    // Scroll to result
                    document.getElementById('proxyResult').scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    showStatus('✓ Proxy generated successfully!', 'success');
                } else {
                    showStatus(`✗ Failed to generate proxy: ${data.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error generating proxy:', error);
                showStatus('Error generating proxy. Please try again.', 'error');
            } finally {
                generateButton.disabled = false;
                generateButton.textContent = 'generate random proxy';
            }
        }

        // Check for saved API key on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadCountryImages();
            
            const savedKey = getSavedApiKey();
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                await verifyApiKey();
            }
        });

        // Handle enter key in API input
        document.getElementById('apiKeyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyApiKey();
            }
        });
    </script>
</body>
</html>
