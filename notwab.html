<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batproxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #e0e0e0;
            position: relative;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.25) grayscale(100%) blur(8px);
            transition: background-image 0.5s ease-in-out;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .bat {
            color: #a0a0a0;
            font-weight: 700;
        }

        .proxy {
            color: #ffffff;
            font-weight: 300;
        }

        .user-greeting {
            font-size: 1.1rem;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .api-section {
            width: 100%;
            max-width: 500px;
        }

        .title-small {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 30px;
            text-align: center;
            color: #a0a0a0;
        }

        .input-container {
            position: relative;
            margin-bottom: 20px;
        }

        .api-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(20, 20, 20, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: #ffffff;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        .api-input:focus {
            outline: none;
            border-color: #ffffff;
        }

        .verify-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .verify-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .status-message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
        }

        .status-message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #a0ffa0;
        }

        .status-message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ffa0a0;
        }

        .generator-section {
            width: 100%;
            max-width: 600px;
        }

        .info-card {
            background: rgba(20, 20, 20, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .info-value {
            font-size: 2rem;
            font-weight: 300;
            color: #ffffff;
        }

        .generate-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 20px 0;
        }

        .generate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
        }

        .proxy-result {
            padding: 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .proxy-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .proxy-detail-item {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            text-align: center;
        }

        .proxy-detail-label {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-bottom: 10px;
        }

        .proxy-detail-value {
            font-size: 1.8rem;
            font-weight: 300;
            color: #ffffff;
            word-break: break-all;
        }

        .ip-info {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
        }

        .ip-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .ip-info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .ip-info-label {
            font-size: 0.7rem;
            color: #808080;
        }

        .ip-info-value {
            font-size: 1rem;
            color: #ffffff;
        }

        .flag-image {
            width: 32px;
            height: 24px;
            border-radius: 4px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .header { flex-direction: column; gap: 15px; }
            .proxy-details { grid-template-columns: 1fr; }
            .ip-info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="background-overlay" id="backgroundOverlay" style="background-image: url('https://images.pexels.com/photos/290386/pexels-photo-290386.jpeg');"></div>
    
    <div class="container">
        <header class="header">
            <h1>
                <span class="bat">bat</span><span class="proxy">proxy</span>
            </h1>
            <div id="userGreeting" class="user-greeting" style="display: none;">
                <img id="userFlag" class="flag-image" src="" alt="">
                <span id="greetingText"></span>
            </div>
        </header>

        <main class="main-content">
            <div id="apiSection" class="api-section">
                <div class="title-small">enter your API key</div>
                <div class="input-container">
                    <input type="text" id="apiKeyInput" class="api-input" placeholder="••••••••••••••••">
                    <button class="verify-button" onclick="verifyApiKey()">verify</button>
                </div>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <div id="generatorSection" class="generator-section" style="display: none;">
                <div class="info-card">
                    <div class="info-value">6 hours</div>
                    <div style="color:#808080; margin-top:5px;">session duration</div>
                </div>
                
                <button class="generate-button" onclick="generateProxy()">generate random proxy</button>
                
                <div id="proxyResult" class="proxy-result" style="display: none;">
                    <h3 style="text-align:center; margin-bottom:20px;">✅ proxy generated</h3>
                    <div class="proxy-details">
                        <div class="proxy-detail-item">
                            <div class="proxy-detail-label">port</div>
                            <div class="proxy-detail-value" id="proxyPort">-</div>
                        </div>
                        <div class="proxy-detail-item">
                            <div class="proxy-detail-label">ip</div>
                            <div class="proxy-detail-value" id="proxyIp">-</div>
                        </div>
                    </div>
                    
                    <div class="ip-info" id="ipInfo">
                        <div style="display:flex; align-items:center; gap:10px; color:#a0a0a0;">
                            <span>📍 location</span>
                            <img id="resultFlag" class="flag-image" src="" style="display:none;">
                        </div>
                        <div class="ip-info-grid" id="ipInfoGrid"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'https://proxy-api-zeta.vercel.app';
        
        // Simple country to image mapping (just add more as needed)
        const countryImages = {
            'AF': 'https://images.pexels.com/photos/31093705/pexels-photo-31093705.jpeg',
            'AL': 'https://images.pexels.com/photos/13275966/pexels-photo-13275966.jpeg',
            'DZ': 'https://images.pexels.com/photos/18233267/pexels-photo-18233267.jpeg',
            'US': 'https://images.pexels.com/photos/290386/pexels-photo-290386.jpeg',
            'GB': 'https://images.pexels.com/photos/460672/pexels-photo-460672.jpeg',
            'FR': 'https://images.pexels.com/photos/2363/france-eiffel-tower-landmark-lights.jpg',
            'DE': 'https://images.pexels.com/photos/532826/pexels-photo-532826.jpeg',
            'IT': 'https://images.pexels.com/photos/1796715/pexels-photo-1796715.jpeg',
            'ES': 'https://images.pexels.com/photos/258045/pexels-photo-258045.jpeg',
            'JP': 'https://images.pexels.com/photos/402028/pexels-photo-402028.jpeg',
            'CN': 'https://images.pexels.com/photos/208745/pexels-photo-208745.jpeg',
            'IN': 'https://images.pexels.com/photos/87009/pexels-photo-87009.jpeg',
            'BR': 'https://images.pexels.com/photos/994428/pexels-photo-994428.jpeg',
            'RU': 'https://images.pexels.com/photos/189349/pexels-photo-189349.jpeg',
            'AU': 'https://images.pexels.com/photos/1878293/pexels-photo-1878293.jpeg',
            'CA': 'https://images.pexels.com/photos/358482/pexels-photo-358482.jpeg'
        };

        function getSavedApiKey() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'batproxy_api_key') return value;
            }
            return null;
        }

        function saveApiKey(apiKey) {
            const date = new Date();
            date.setTime(date.getTime() + (30 * 24 * 60 * 60 * 1000));
            document.cookie = `batproxy_api_key=${apiKey}; expires=${date.toUTCString()}; path=/`;
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message ${type}`;
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function generateRandomPort() {
            return Math.floor(Math.random() * (49999 - 10000 + 1)) + 10000;
        }

        async function verifyApiKey() {
            const input = document.getElementById('apiKeyInput');
            const btn = document.querySelector('.verify-button');
            const key = input.value.trim();
            
            if (!key) return showStatus('enter an API key', 'error');
            
            btn.innerHTML = '<span class="loading"></span>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/key/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 'auth-key': key })
                });
                
                const data = await response.json();
                
                if (data.valid) {
                    saveApiKey(key);
                    document.getElementById('apiSection').style.display = 'none';
                    document.getElementById('generatorSection').style.display = 'block';
                    showStatus('✓ verified', 'success');
                    
                    // Get user location
                    fetch('https://ip.decodo.com/json')
                        .then(r => r.json())
                        .then(data => {
                            const countryCode = data.country.code;
                            document.getElementById('greetingText').textContent = `Hi, user`;
                            document.getElementById('userGreeting').style.display = 'flex';
                            
                            // Set background from country
                            if (countryImages[countryCode]) {
                                document.getElementById('backgroundOverlay').style.backgroundImage = `url('${countryImages[countryCode]}')`;
                            }
                        });
                } else {
                    showStatus('invalid key', 'error');
                }
            } catch (error) {
                showStatus('error verifying key', 'error');
            }
            
            btn.innerHTML = 'verify';
        }

        async function generateProxy() {
            const key = getSavedApiKey();
            if (!key) {
                document.getElementById('generatorSection').style.display = 'none';
                document.getElementById('apiSection').style.display = 'block';
                return;
            }
            
            const btn = document.querySelector('.generate-button');
            btn.textContent = 'generating...';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': key
                    },
                    body: JSON.stringify({
                        port: generateRandomPort(),
                        duration: 21600
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('proxyPort').textContent = data.port;
                    document.getElementById('proxyIp').textContent = data.ip;
                    
                    // Get IP location
                    const locResponse = await fetch(`https://nyanc4tt.xyz/api/iplookup?ip=${data.ip}`);
                    const locData = await locResponse.json();
                    
                    // Update background with proxy country
                    if (locData.country_code && countryImages[locData.country_code]) {
                        document.getElementById('backgroundOverlay').style.backgroundImage = `url('${countryImages[locData.country_code]}')`;
                    }
                    
                    // Show flag
                    if (locData.flag_image) {
                        document.getElementById('resultFlag').src = locData.flag_image;
                        document.getElementById('resultFlag').style.display = 'block';
                    }
                    
                    // Fill location info
                    const grid = document.getElementById('ipInfoGrid');
                    grid.innerHTML = `
                        <div class="ip-info-item"><span class="ip-info-label">country</span><span class="ip-info-value">${locData.country || '-'}</span></div>
                        <div class="ip-info-item"><span class="ip-info-label">city</span><span class="ip-info-value">${locData.city || '-'}</span></div>
                        <div class="ip-info-item"><span class="ip-info-label">region</span><span class="ip-info-value">${locData.region || '-'}</span></div>
                        <div class="ip-info-item"><span class="ip-info-label">isp</span><span class="ip-info-value">${locData.isp || '-'}</span></div>
                        <div class="ip-info-item"><span class="ip-info-label">asn</span><span class="ip-info-value">${locData.asn || '-'}</span></div>
                        <div class="ip-info-item"><span class="ip-info-label">coordinates</span><span class="ip-info-value">${locData.latitude ? `${locData.latitude}, ${locData.longitude}` : '-'}</span></div>
                    `;
                    
                    document.getElementById('proxyResult').style.display = 'block';
                }
            } catch (error) {
                showStatus('error generating proxy', 'error');
            }
            
            btn.textContent = 'generate random proxy';
            btn.disabled = false;
        }

        // Check for saved key on load
        window.onload = () => {
            const saved = getSavedApiKey();
            if (saved) {
                document.getElementById('apiKeyInput').value = saved;
                verifyApiKey();
            }
        };
    </script>
</body>
</html>
