<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batproxy · secure tunnel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        /* main container */
        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            position: relative;
        }

        /* LOADING SCREEN — full-screen, step indicator */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.3s ease;
        }

        .loading-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 32px;
            padding: 2.8rem 2.5rem;
            width: 440px;
            box-shadow: 0 25px 45px rgba(0,0,0,1);
        }

        .loading-card h2 {
            font-weight: 450;
            font-size: 2rem;
            color: white;
            margin-bottom: 2rem;
        }

        .step-list {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #aaa;
            font-size: 1rem;
            border-bottom: 1px dashed #252525;
            padding-bottom: 0.8rem;
        }

        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #202020;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #5f5f5f;
        }

        .step-icon.active {
            background: #2b5a3b;
            color: #b3ffcf;
            box-shadow: 0 0 8px #1f9a5a;
        }

        .step-icon.done {
            background: #1f5a2d;
            color: #9effb4;
        }

        .step-label {
            flex: 1;
        }

        .step-status {
            color: #5f5f5f;
            font-size: 0.85rem;
        }

        /* LOGIN SCREEN */
        .login-screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            flex-shrink: 0;
        }

        .login-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 28px;
            padding: 2.5rem 2.2rem;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .login-card h1 {
            font-weight: 450;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: white;
            margin-bottom: 0.25rem;
        }

        .login-card .sub {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border-left: 3px solid #2b2b2b;
            padding-left: 1rem;
        }

        .key-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #2b2b2b;
            border-radius: 14px;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            color: white;
            outline: none;
            margin-bottom: 1.8rem;
        }

        .key-input:focus {
            border-color: #3b3b3b;
        }

        .login-btn {
            width: 100%;
            background: #1f1f1f;
            border: 1px solid #2e2e2e;
            color: #f0f0f0;
            font-size: 1.1rem;
            font-weight: 480;
            padding: 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #2a2a2a;
        }

        /* main dashboard */
        .dashboard {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            background: #000000;
            overflow: hidden;
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 2.5rem;
            background: #0c0c0c;
            border-bottom: 1px solid #1e1e1e;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: white;
        }

        .logo span {
            color: #5f5f5f;
            margin-left: 6px;
        }

        .key-badge {
            background: #141414;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            border: 1px solid #2a2a2a;
            font-size: 0.9rem;
            color: #dddddd;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .key-badge .dot {
            width: 10px;
            height: 10px;
            background: #1f9a5a;
            border-radius: 50%;
            box-shadow: 0 0 8px #1f9a5a70;
        }

        .key-badge .key-trunc {
            font-family: monospace;
            background: #1e1e1e;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            color: #c5c5c5;
        }

        /* main content */
        .main-panel {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #000000;
        }

        /* left panel */
        .left-panel {
            width: 380px;
            background: #0a0a0a;
            border-right: 1px solid #1b1b1b;
            padding: 2rem 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .section-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #5a5a5a;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        /* country cards with images */
        .country-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .country-card {
            background: #111111;
            border: 1px solid #242424;
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .country-card:hover {
            background: #1b1b1b;
            border-color: #3c3c3c;
        }

        .country-card.selected {
            border-color: #5f5f5f;
            background: #1a1a1a;
            box-shadow: 0 0 0 1px #3e3e3e;
        }

        .country-flag-img {
            width: 42px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #333;
            background: #1f1f1f;
            filter: brightness(0.85) contrast(1.1);
            transition: filter 0.2s;
        }

        .country-card:hover .country-flag-img {
            filter: brightness(1) contrast(1.1);
        }

        .country-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .country-name {
            font-size: 1rem;
            font-weight: 450;
            color: #ececec;
        }

        .country-code {
            font-size: 0.7rem;
            color: #777;
            text-transform: uppercase;
        }

        /* background image placeholder — subtle */
        .country-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.08;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 1;
        }

        .country-card:hover::after {
            opacity: 0.15;
        }

        /* each card gets its image via inline style */
        .country-card .content-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            color: #777;
            font-size: 0.9rem;
            padding: 0.5rem 0.3rem;
            border-bottom: 1px dashed #222;
        }

        .generate-btn {
            background: #1c1c1c;
            border: 1px solid #2e2e2e;
            color: white;
            width: 100%;
            padding: 1.2rem 0;
            border-radius: 36px;
            font-size: 1.1rem;
            margin: 1rem 0 0.2rem 0;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #262626;
        }

        /* right panel */
        .right-panel {
            flex: 1;
            background: #050505;
            padding: 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .proxy-result {
            background: #0e0e0e;
            border: 1px solid #202020;
            border-radius: 26px;
            padding: 2.5rem;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .proxy-port-large {
            font-size: 4rem;
            font-weight: 450;
            letter-spacing: -2px;
            color: white;
            line-height: 1.1;
        }

        .proxy-ip-small {
            font-size: 1.4rem;
            font-weight: 300;
            color: #8a8a8a;
            margin-top: 0.25rem;
        }

        .divider-light {
            height: 1px;
            background: #232323;
            margin: 2rem 0;
        }

        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
        }

        .geo-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .geo-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #5e5e5e;
        }

        .geo-value {
            font-size: 1.2rem;
            color: #e2e2e2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            gap: 12px;
            padding: 2rem;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #2b2b2b;
            border-top: 2px solid #7a7a7a;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }

        .hidden { display: none; }
        .error-message { color: #cf7f7f; background: #1f1010; border-radius: 40px; padding: 1rem; }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- FULL LOADING SCREEN WITH STEPS -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-card">
            <h2>batproxy</h2>
            <div class="step-list">
                <div class="step-item" id="step1">
                    <div class="step-icon" id="step1Icon">1</div>
                    <span class="step-label">Validate API key</span>
                    <span class="step-status" id="step1Status">pending</span>
                </div>
                <div class="step-item" id="step2">
                    <div class="step-icon" id="step2Icon">2</div>
                    <span class="step-label">Fetch country list</span>
                    <span class="step-status" id="step2Status">pending</span>
                </div>
                <div class="step-item" id="step3">
                    <div class="step-icon" id="step3Icon">3</div>
                    <span class="step-label">Load country images</span>
                    <span class="step-status" id="step3Status">pending</span>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIN SCREEN (shown if no cookie / invalid) -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h1>batproxy</h1>
            <div class="sub">authenticated tunnel</div>
            <input type="text" class="key-input" id="apiKeyInput" placeholder="enter your api key" autocomplete="off">
            <button class="login-btn" id="loginBtn">→ access panel</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <div class="bar">
            <div class="logo">batproxy <span>// secure</span></div>
            <div class="key-badge" id="keyBadge">
                <span class="dot"></span>
                <span class="key-trunc" id="usernameDisplay">user</span>
            </div>
        </div>

        <div class="main-panel">
            <!-- LEFT panel: country cards with images -->
            <div class="left-panel">
                <div>
                    <div class="section-label">01 · select egress</div>
                    <div id="countryListContainer" class="country-grid"></div>

                    <div style="margin-top: 1.5rem;">
                        <div class="info-row"><span>duration</span><span>6 minutes</span></div>
                        <div class="info-row"><span>port range</span><span>10000–49999</span></div>
                    </div>

                    <button class="generate-btn" id="generateBtn">generate proxy</button>
                </div>
            </div>

            <!-- RIGHT panel -->
            <div class="right-panel">
                <div class="proxy-result" id="proxyResult">
                    <div class="loading-overlay"><span>select a country and generate</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // --- config
        const BASE_URL = 'https://proxy-api-zeta.vercel.app';
        const CSV_URL = 'https://jklm.gay/list.csv';  // your csv with images

        // DOM
        const loadingScreen = document.getElementById('loadingScreen');
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const loginBtn = document.getElementById('loginBtn');
        const usernameSpan = document.getElementById('usernameDisplay');
        const countryListDiv = document.getElementById('countryListContainer');
        const generateBtn = document.getElementById('generateBtn');
        const proxyResultDiv = document.getElementById('proxyResult');

        // step elements
        const step1Icon = document.getElementById('step1Icon');
        const step2Icon = document.getElementById('step2Icon');
        const step3Icon = document.getElementById('step3Icon');
        const step1Status = document.getElementById('step1Status');
        const step2Status = document.getElementById('step2Status');
        const step3Status = document.getElementById('step3Status');

        // state
        let apiKey = '';
        let username = 'user';
        let countriesFromApi = [];            // codes from /proxy/countries
        let countryImageMap = new Map();       // code -> imageUrl from CSV
        let countriesFull = [];                 // { code, name, image }
        let selectedCountryCode = 'bs';

        // --- helper: decode base64 api key -> username
        function extractUsernameFromKey(key) {
            try {
                const decoded = atob(key);
                // format: u-{username}-k-{hex}
                const match = decoded.match(/^u-([a-zA-Z0-9._-]+)-k-/);
                if (match && match[1]) return match[1];
            } catch (e) {}
            return key.length > 10 ? key.substring(0, 6) + '…' : key; // fallback
        }

        // --- cookie
        function setCookie(name, value, days) {
            const d = new Date(); d.setTime(d.getTime() + days*86400000);
            document.cookie = `${name}=${value};path=/;SameSite=Strict`;
        }
        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        // --- update loading step
        function setStep(step, status) {
            const icon = [step1Icon, step2Icon, step3Icon][step-1];
            const statusSpan = [step1Status, step2Status, step3Status][step-1];
            if (status === 'loading') {
                icon.classList.add('active');
                icon.innerText = '⋯';
                statusSpan.innerText = 'working';
            } else if (status === 'done') {
                icon.classList.remove('active');
                icon.classList.add('done');
                icon.innerText = '✓';
                statusSpan.innerText = 'done';
            } else if (status === 'error') {
                icon.innerText = '!';
                icon.style.background = '#5a2b2b';
                statusSpan.innerText = 'failed';
            }
        }

        // --- load csv with images
        async function loadCountryImages() {
            try {
                const res = await fetch(CSV_URL);
                if (!res.ok) throw new Error('csv fetch failed');
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                // assume header: English short name,Alpha-2 code,Alpha-3 code,Numeric,PhotoUrl
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(',');
                    if (parts.length >= 5) {
                        const code = parts[1].trim().toLowerCase(); // Alpha-2 code
                        const imageUrl = parts[4].trim();
                        if (code && imageUrl) countryImageMap.set(code, imageUrl);
                    }
                }
            } catch (e) {
                console.warn('using fallback flags (no csv)');
            }
        }

        // --- render country cards with images
        function renderCountryCards(selectedCode) {
            if (!countriesFull.length) return;
            countryListDiv.innerHTML = countriesFull.map(c => {
                const imageUrl = countryImageMap.get(c.code) || `https://flagcdn.com/w80/${c.code}.png`; // fallback flag
                const selectedClass = (c.code === selectedCode) ? 'selected' : '';
                return `
                    <div class="country-card ${selectedClass}" data-code="${c.code}" data-image="${imageUrl}">
                        <div class="content-wrap">
                            <img class="country-flag-img" src="${imageUrl}" alt="" loading="lazy"
                                onerror="this.src='https://flagcdn.com/w80/${c.code}.png'">
                            <div class="country-info">
                                <span class="country-name">${c.name}</span>
                                <span class="country-code">${c.code.toUpperCase()}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // attach click listeners
            document.querySelectorAll('.country-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.country-card').forEach(cc => cc.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedCountryCode = card.dataset.code;
                });
                // subtle background image via pseudo
                const imgUrl = card.dataset.image;
                if (imgUrl) {
                    card.style.setProperty('--bg-url', `url(${imgUrl})`);
                    // add pseudo content via style (inline doesn't work for ::after)
                    const style = document.createElement('style');
                    style.textContent = `
                        .country-card[data-code="${card.dataset.code}"]::after {
                            background-image: ${imgUrl};
                        }
                    `;
                    document.head.appendChild(style);
                }
            });
        }

        // --- initialization with loading steps
        async function initializeWithKey(key) {
            // show loading screen, hide login & dashboard
            loadingScreen.style.display = 'flex';
            loginScreen.style.display = 'none';
            dashboard.style.display = 'none';

            // step 1: validate & extract username
            setStep(1, 'loading');
            apiKey = key;
            username = extractUsernameFromKey(key);
            usernameSpan.innerText = username;
            await new Promise(r => setTimeout(r, 400)); // visual
            setStep(1, 'done');

            // step 2: fetch countries from api
            setStep(2, 'loading');
            try {
                const res = await fetch(`${BASE_URL}/proxy/countries`, { headers: { 'x-api-key': apiKey } });
                if (!res.ok) throw new Error('invalid key');
                const json = await res.json();
                countriesFromApi = json.countries || [];
                if (!countriesFromApi.length) throw new Error('no countries');
                setStep(2, 'done');
            } catch (e) {
                setStep(2, 'error');
                loadingScreen.style.display = 'none';
                loginScreen.style.display = 'flex';
                alert('api key validation failed');
                return false;
            }

            // step 3: load csv images and build full list
            setStep(3, 'loading');
            await loadCountryImages(); // fills countryImageMap

            // build countriesFull using flagcdn names as fallback
            const flagRes = await fetch('https://flagcdn.com/en/codes.json').catch(()=>null);
            const flagMap = flagRes ? await flagRes.json() : {};
            countriesFull = countriesFromApi.map(code => ({
                code,
                name: flagMap[code] || code.toUpperCase()
            })).sort((a,b) => a.name.localeCompare(b.name));

            setStep(3, 'done');
            await new Promise(r => setTimeout(r, 300));

            // set default selection
            if (countriesFull.some(c => c.code === 'bs')) selectedCountryCode = 'bs';
            else if (countriesFull.length) selectedCountryCode = countriesFull[0].code;

            renderCountryCards(selectedCountryCode);

            // switch to dashboard
            loadingScreen.style.display = 'none';
            dashboard.style.display = 'flex';
            setCookie('batproxy_apikey', apiKey, 7);
            return true;
        }

        // --- login click
        loginBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) return alert('enter key');
            await initializeWithKey(key);
        });

        apiKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // --- generate proxy
        generateBtn.addEventListener('click', async () => {
            if (!selectedCountryCode) return alert('select a country');
            const port = Math.floor(Math.random() * (49999 - 10000 + 1)) + 10000;
            proxyResultDiv.innerHTML = `<div class="loading-overlay"><div class="spinner"></div> generating...</div>`;

            try {
                const res = await fetch(`${BASE_URL}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                    body: JSON.stringify({ port, countrycode: selectedCountryCode, duration: 6 })
                });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error('generation failed');

                // ip lookup
                let geo = null;
                try {
                    const geoRes = await fetch(`https://maxmind.api.iii.vg/?ip=${data.ip}`);
                    if (geoRes.ok) geo = await geoRes.json();
                } catch (ge) {}

                const countryName = geo?.country?.name || '—';
                const countryCode = geo?.country?.iso_code || '';
                const city = geo?.city?.name || '—';
                const asnOrg = geo?.asn?.organization || '—';

                proxyResultDiv.innerHTML = `
                    <div class="proxy-port-large">${data.port}</div>
                    <div class="proxy-ip-small">${data.ip}</div>
                    <div class="divider-light"></div>
                    <div class="geo-grid">
                        <div class="geo-item"><span class="geo-label">country</span><span class="geo-value">${countryName} <small>${countryCode}</small></span></div>
                        <div class="geo-item"><span class="geo-label">ISP</span><span class="geo-value">${asnOrg}</span></div>
                        <div class="geo-item"><span class="geo-label">city</span><span class="geo-value">${city}</span></div>
                        <div class="geo-item"><span class="geo-label">duration</span><span class="geo-value">6 min</span></div>
                    </div>
                `;
            } catch (err) {
                proxyResultDiv.innerHTML = `<div class="error-message">${err.message}</div>`;
            }
        });

        // --- bootstrap: check cookie
        (async () => {
            // preload nothing, wait for cookie
            const cookieKey = getCookie('batproxy_apikey');
            if (cookieKey) {
                apiKeyInput.value = cookieKey;
                await initializeWithKey(cookieKey);
            } else {
                loadingScreen.style.display = 'none';
                loginScreen.style.display = 'flex';
                dashboard.style.display = 'none';
            }
        })();
    })();
</script>
</body>
</html>
