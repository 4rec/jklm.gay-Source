<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batproxy · AMOLED</title>
    <style>
        /* --- AMOLED black & grey — no emoji glare, crisp --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000000;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 16px;
            color: #e0e0e0;
        }

        /* main containers – pure black background, soft grey cards */
        .login-screen, .app-screen {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            transition: opacity 0.2s ease;
        }

        .card {
            background: #0f0f0f;
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(80, 80, 80, 0.2);
            border: 1px solid #1e1e1e;
            backdrop-filter: blur(2px);
        }

        .card-header {
            margin-bottom: 28px;
        }

        .card-header h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            color: white;
        }

        .card-header .sub {
            color: #909090;
            font-size: 0.9rem;
            margin-top: 6px;
            border-left: 3px solid #2a2a2a;
            padding-left: 12px;
        }

        /* form elements – dark, minimal */
        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 1rem;
            color: #f0f0f0;
            outline: none;
            transition: border 0.15s, background 0.15s;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: #666;
            background: #1e1e1e;
        }

        input::placeholder {
            color: #3f3f3f;
            font-weight: 300;
        }

        button {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 500;
            color: #ddd;
            cursor: pointer;
            transition: all 0.15s;
            width: auto;
            min-width: 160px;
            letter-spacing: 0.3px;
        }

        button:hover {
            background: #2a2a2a;
            border-color: #555;
            color: white;
        }

        button.primary {
            background: #2a2a2a;
            border-color: #444;
            color: white;
        }

        button.primary:hover {
            background: #3a3a3a;
            border-color: #777;
        }

        .flex-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .flex-row .field {
            flex: 1;
            margin-bottom: 0;
        }

        /* country selector with flag preview (text only – clean) */
        .country-select-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .country-select-wrapper select {
            flex: 1;
        }

        .flag-preview {
            background: #1a1a1a;
            border-radius: 40px;
            padding: 8px 18px;
            border: 1px solid #2c2c2c;
            font-size: 0.9rem;
            color: #bbb;
            white-space: nowrap;
        }

        /* result panel */
        .result-panel {
            margin-top: 28px;
            background: #0a0a0a;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #242424;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .proxy-line {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            background: #111;
            border-radius: 40px;
            padding: 12px 20px;
            border: 1px solid #2a2a2a;
        }

        .proxy-line .port-badge {
            background: #1f1f1f;
            padding: 6px 18px;
            border-radius: 40px;
            font-family: 'Fira Code', monospace;
            font-size: 1.3rem;
            font-weight: 500;
            color: #cccccc;
            border: 1px solid #3a3a3a;
        }

        .ip-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 20px;
            background: #0c0c0c;
            border-radius: 24px;
            padding: 18px;
            border: 1px solid #252525;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #777;
            letter-spacing: 0.3px;
        }

        .detail-value {
            font-size: 1rem;
            color: #eaeaea;
            word-break: break-word;
        }

        .status-badge {
            color: #9b9b9b;
            font-size: 0.85rem;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #333;
            border-radius: 50%;
            border-top-color: #aaa;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        hr {
            border: none;
            border-top: 1px solid #262626;
            margin: 24px 0 16px;
        }

        .small-note {
            font-size: 0.75rem;
            color: #5a5a5a;
            text-align: right;
            margin-top: 4px;
        }

        /* no scrolling on main screen – height fixed */
        .app-screen .card {
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #333 #0a0a0a;
        }

        .app-screen .card::-webkit-scrollbar {
            width: 6px;
        }
        .app-screen .card::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        .app-screen .card::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN (API key prompt) -->
    <div id="loginScreen" class="login-screen">
        <div class="card">
            <div class="card-header">
                <h1>batproxy</h1>
                <div class="sub">amoled · lean · no emoji</div>
            </div>
            <div class="field">
                <label>api key</label>
                <input type="text" id="apiKeyInput" placeholder="e.g. test-key-123" value="test-key-123" autocomplete="off">
            </div>
            <button id="saveKeyBtn" class="primary">enter →</button>
            <div class="small-note" style="margin-top:16px;">key is saved in browser (cookie)</div>
        </div>
    </div>

    <!-- MAIN APPLICATION SCREEN (hidden initially) -->
    <div id="appScreen" class="app-screen hidden">
        <div class="card">
            <div class="card-header" style="display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h1>batproxy</h1>
                    <div class="sub">pick country · generate</div>
                </div>
                <button id="logoutBtn" style="min-width: auto; padding: 8px 18px;">✕</button>
            </div>

            <!-- loading overlay (inside card) -->
            <div id="countriesLoader" class="flex-row" style="justify-content: center; padding: 30px 0;">
                <span class="loader"></span> <span style="color:#888;">loading countries ...</span>
            </div>

            <!-- main ui (hidden until countries loaded) -->
            <div id="mainUi" class="hidden">
                <div class="field">
                    <label>active api key</label>
                    <input type="text" id="activeApiKeyDisplay" readonly disabled style="background:#111; color:#aaa;">
                </div>

                <div class="flex-row" style="margin-bottom: 8px;">
                    <div class="field" style="flex: 2;">
                        <label>country</label>
                        <div class="country-select-wrapper">
                            <select id="countrySelect"></select>
                            <div id="selectedFlagPreview" class="flag-preview">—</div>
                        </div>
                    </div>
                    <div class="field" style="flex: 1;">
                        <label>duration (s)</label>
                        <input type="text" value="6" readonly disabled style="background:#111;">
                    </div>
                </div>

                <!-- generate button + random port hint -->
                <div style="display: flex; gap: 12px; align-items: center; margin: 16px 0 12px;">
                    <button id="generateBtn" class="primary" style="flex:1;">generate proxy</button>
                    <div class="status-badge" id="randomPortHint">port 10000‑49999</div>
                </div>

                <!-- result panel (updated after generation) -->
                <div id="resultPanel" class="result-panel hidden">
                    <div class="proxy-line">
                        <span style="color:#aaa;">proxy</span>
                        <span class="port-badge" id="proxyPort">—</span>
                        <span style="color:#666; font-size:0.9rem;" id="proxyIp"></span>
                    </div>
                    <div class="ip-details-grid" id="ipDetails">
                        <!-- filled dynamically -->
                        <div class="detail-item"><span class="detail-label">country</span><span class="detail-value" id="detailCountry">—</span></div>
                        <div class="detail-item"><span class="detail-label">city</span><span class="detail-value" id="detailCity">—</span></div>
                        <div class="detail-item"><span class="detail-label">region</span><span class="detail-value" id="detailRegion">—</span></div>
                        <div class="detail-item"><span class="detail-label">isp</span><span class="detail-value" id="detailIsp">—</span></div>
                    </div>
                </div>
            </div>
            <div class="small-note" style="margin-top: 16px;">⚡ random port · no scrolling needed</div>
        </div>
    </div>

    <script>
        (function() {
            // --- simple cookie helpers (save api key)
            function setCookie(name, value, days) {
                const d = new Date();
                d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
                document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
            }
            function getCookie(name) {
                const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? decodeURIComponent(match[2]) : null;
            }

            // --- DOM elements
            const loginScreen = document.getElementById('loginScreen');
            const appScreen = document.getElementById('appScreen');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const saveKeyBtn = document.getElementById('saveKeyBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const countriesLoader = document.getElementById('countriesLoader');
            const mainUi = document.getElementById('mainUi');
            const activeApiKeyDisplay = document.getElementById('activeApiKeyDisplay');
            const countrySelect = document.getElementById('countrySelect');
            const flagPreview = document.getElementById('selectedFlagPreview');
            const generateBtn = document.getElementById('generateBtn');
            const randomPortHint = document.getElementById('randomPortHint');
            const resultPanel = document.getElementById('resultPanel');
            const proxyPortSpan = document.getElementById('proxyPort');
            const proxyIpSpan = document.getElementById('proxyIp');
            const detailCountry = document.getElementById('detailCountry');
            const detailCity = document.getElementById('detailCity');
            const detailRegion = document.getElementById('detailRegion');
            const detailIsp = document.getElementById('detailIsp');

            // --- state
            let currentApiKey = getCookie('batproxy_key') || '';   // read cookie
            let countriesList = [];        // { code, name } from flagcdn
            let availableCodes = new Set(); // country codes from /proxy/countries
            let countryMap = new Map();     // code -> full name

            const BASE_URL = 'https://proxy-api-zeta.vercel.app';
            const FLAG_CODES_URL = 'https://flagcdn.com/en/codes.json';

            // --- if API key exists, skip login and init app
            if (currentApiKey) {
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                initializeApp(currentApiKey);
            } else {
                // show login screen
            }

            // --- LOGIN: save key and switch view
            saveKeyBtn.addEventListener('click', () => {
                const key = apiKeyInput.value.trim();
                if (!key) return;
                setCookie('batproxy_key', key, 30); // 30 days
                currentApiKey = key;
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                initializeApp(key);
            });

            // logout: clear cookie, reset UI
            logoutBtn.addEventListener('click', () => {
                setCookie('batproxy_key', '', -1);
                currentApiKey = '';
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                // reset any sensitive fields
                countrySelect.innerHTML = '';
                resultPanel.classList.add('hidden');
            });

            // --- main init: fetch countries, populate dropdown, show UI
            async function initializeApp(apiKey) {
                activeApiKeyDisplay.value = apiKey;
                countriesLoader.classList.remove('hidden');
                mainUi.classList.add('hidden');
                resultPanel.classList.add('hidden');

                try {
                    // 1. fetch available country codes from proxy api (with auth)
                    const countriesRes = await fetch(`${BASE_URL}/proxy/countries`, {
                        headers: { 'x-api-key': apiKey }
                    });
                    if (!countriesRes.ok) throw new Error(`API error ${countriesRes.status}`);
                    const countriesData = await countriesRes.json(); // array like ["ca","bm",...]
                    // expected: { countries: [...] } or direct array? based on doc example: { "countries": ["ca","bm",...] }
                    let codesArray = [];
                    if (Array.isArray(countriesData)) codesArray = countriesData;
                    else if (countriesData.countries && Array.isArray(countriesData.countries)) codesArray = countriesData.countries;
                    else throw new Error('Unexpected countries format');

                    availableCodes = new Set(codesArray.map(c => c.toLowerCase()));

                    // 2. fetch flagcdn codes for full names
                    const flagRes = await fetch(FLAG_CODES_URL);
                    const flagNames = await flagRes.json(); // { "ad": "Andorra", ... }

                    // build map and filter only allowed codes
                    countryMap.clear();
                    for (const [code, name] of Object.entries(flagNames)) {
                        const lowerCode = code.toLowerCase();
                        if (availableCodes.has(lowerCode)) {
                            countryMap.set(lowerCode, name);
                        }
                    }

                    // sort by name
                    const sorted = Array.from(countryMap.entries()).sort((a, b) => a[1].localeCompare(b[1]));

                    // populate select
                    countrySelect.innerHTML = '';
                    for (const [code, name] of sorted) {
                        const option = document.createElement('option');
                        option.value = code;
                        option.textContent = `${name} (${code.toUpperCase()})`;
                        countrySelect.appendChild(option);
                    }

                    // default maybe "BS" if exists
                    if (countryMap.has('bs')) countrySelect.value = 'bs';
                    else if (sorted.length > 0) countrySelect.value = sorted[0][0];

                    updateFlagPreview();
                    countriesLoader.classList.add('hidden');
                    mainUi.classList.remove('hidden');
                } catch (err) {
                    countriesLoader.innerHTML = `<span style="color:#b66;">⚠️ error: ${err.message}</span>`;
                }
            }

            // update flag preview text
            function updateFlagPreview() {
                const code = countrySelect.value;
                const name = countryMap.get(code) || code.toUpperCase();
                flagPreview.textContent = `${name} (${code.toUpperCase()})`;
            }
            countrySelect.addEventListener('change', updateFlagPreview);

            // --- generate proxy
            generateBtn.addEventListener('click', async () => {
                const apiKey = currentApiKey;
                if (!apiKey) return;

                // generate random port 10000-49999
                const port = Math.floor(Math.random() * (49999 - 10000 + 1)) + 10000;
                randomPortHint.textContent = `port ${port}`;

                const countryCode = countrySelect.value;
                if (!countryCode) return;

                // temporarily disable button
                generateBtn.disabled = true;
                generateBtn.textContent = 'generating...';

                try {
                    // 1. POST /generate
                    const genRes = await fetch(`${BASE_URL}/generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey
                        },
                        body: JSON.stringify({
                            port: port,
                            countrycode: countryCode,
                            duration: 6   // fixed as doc: 6
                        })
                    });

                    if (!genRes.ok) throw new Error(`generate failed (${genRes.status})`);
                    const genData = await genRes.json();  // { duration, ip, port, success }

                    if (!genData.success) throw new Error('proxy generation unsuccessful');

                    const proxyIp = genData.ip;
                    const proxyPort = genData.port || port;

                    // 2. ip lookup
                    const lookupRes = await fetch(`https://nyanc4tt.xyz/api/iplookup?ip=${proxyIp}`);
                    if (!lookupRes.ok) throw new Error('IP lookup failed');
                    const lookup = await lookupRes.json();  // includes country, city, region, isp etc.

                    // update result panel
                    proxyPortSpan.textContent = proxyPort;
                    proxyIpSpan.textContent = proxyIp;
                    detailCountry.textContent = lookup.country || '—';
                    detailCity.textContent = lookup.city || '—';
                    detailRegion.textContent = lookup.region || '—';
                    detailIsp.textContent = lookup.isp || '—';

                    resultPanel.classList.remove('hidden');
                } catch (err) {
                    alert(`error: ${err.message}`);
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'generate proxy';
                }
            });

            // ensure flag updates when app loads
            window.updateFlagPreview = updateFlagPreview; // for later calls

            // if somehow countrySelect changes after generation, fine
        })();
    </script>
</body>
</html>
