<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batproxy · secure tunnel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        /* LOADING SCREEN - detailed steps */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .loading-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 28px;
            padding: 2.5rem;
            width: 420px;
        }

        .loading-title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .step-container {
            margin: 1.5rem 0;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
            color: #888;
        }

        .step-item.active {
            color: white;
        }

        .step-item.completed {
            color: #4ade80;
        }

        .step-indicator {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-item.completed .step-indicator {
            background: #4ade80;
            border-color: #4ade80;
            color: black;
        }

        .step-item.active .step-indicator {
            border-color: #60a5fa;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin: 2rem 0 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #60a5fa;
            width: 0%;
            transition: width 0.3s;
        }

        /* LOGIN SCREEN */
        .login-screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .login-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 28px;
            padding: 2.5rem 2.2rem;
            width: 420px;
        }

        .login-card h1 {
            font-weight: 450;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: white;
            margin-bottom: 0.25rem;
        }

        .login-card .sub {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border-left: 3px solid #2b2b2b;
            padding-left: 1rem;
        }

        .key-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #2b2b2b;
            border-radius: 14px;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            color: white;
            outline: none;
            margin-bottom: 1.8rem;
        }

        .login-btn {
            width: 100%;
            background: #1f1f1f;
            border: 1px solid #2e2e2e;
            color: #f0f0f0;
            font-size: 1.1rem;
            padding: 1rem;
            border-radius: 40px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #2a2a2a;
        }

        /* MAIN DASHBOARD */
        .dashboard {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            background: #000000;
            overflow: hidden;
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 2.5rem;
            background: #0c0c0c;
            border-bottom: 1px solid #1e1e1e;
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 500;
            color: white;
        }

        .logo span {
            color: #5f5f5f;
        }

        .user-badge {
            background: #141414;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .user-badge .dot {
            width: 10px;
            height: 10px;
            background: #1f9a5a;
            border-radius: 50%;
        }

        .username {
            color: #bbbbbb;
            font-weight: 500;
        }

        .main-panel {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 380px;
            background: #0a0a0a;
            border-right: 1px solid #1b1b1b;
            padding: 2rem 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
        }

        .section-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #5a5a5a;
            margin-bottom: 1rem;
        }

        /* Country Grid with Photos */
        .country-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 1rem 0;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .country-grid::-webkit-scrollbar {
            width: 4px;
        }

        .country-grid::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .country-grid::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .country-card {
            position: relative;
            background: #111111;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 12px 10px;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
        }

        .country-card.selected {
            border-color: #60a5fa;
            background: #1a1a2a;
        }

        .country-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .country-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .country-flag {
            width: 24px;
            height: 18px;
            border-radius: 2px;
            border: 1px solid #3a3a3a;
        }

        .country-name {
            font-size: 0.85rem;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .country-code {
            color: #777;
            font-size: 0.7rem;
            margin-left: auto;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            color: #777;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed #222;
        }

        .generate-btn {
            background: #1c1c1c;
            border: 1px solid #2e2e2e;
            color: white;
            width: 100%;
            padding: 1.2rem 0;
            border-radius: 36px;
            font-size: 1.1rem;
            margin: 1rem 0;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #262626;
        }

        /* RIGHT PANEL */
        .right-panel {
            flex: 1;
            background: #050505;
            padding: 2rem 2.5rem;
            overflow-y: auto;
        }

        .proxy-result {
            background: #0e0e0e;
            border: 1px solid #202020;
            border-radius: 26px;
            padding: 2.5rem;
        }

        .proxy-port-large {
            font-size: 4rem;
            font-weight: 450;
            color: white;
            line-height: 1.1;
        }

        .proxy-ip-small {
            font-size: 1.4rem;
            font-weight: 300;
            color: #8a8a8a;
            margin-top: 0.25rem;
        }

        .divider-light {
            height: 1px;
            background: #232323;
            margin: 2rem 0;
        }

        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
        }

        .geo-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .geo-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #5e5e5e;
        }

        .geo-value {
            font-size: 1.2rem;
            color: #e2e2e2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flag-mini {
            width: 28px;
            height: 21px;
            border-radius: 3px;
        }

        .hidden {
            display: none;
        }

        .error-message {
            color: #cf7f7f;
            background: #1f1010;
            border: 1px solid #442222;
            padding: 1rem;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- LOADING SCREEN WITH STEPS -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-card">
            <div class="loading-title">initializing batproxy</div>
            
            <div class="step-container">
                <div class="step-item" id="step1">
                    <div class="step-indicator">1</div>
                    <span>Loading country data...</span>
                </div>
                <div class="step-item" id="step2">
                    <div class="step-indicator">2</div>
                    <span>Fetching country photos...</span>
                </div>
                <div class="step-item" id="step3">
                    <div class="step-indicator">3</div>
                    <span>Checking saved API key...</span>
                </div>
                <div class="step-item" id="step4">
                    <div class="step-indicator">4</div>
                    <span>Validating credentials...</span>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div id="loadingStatus" style="color: #888; text-align: center; margin-top: 1rem;">Starting...</div>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div class="login-screen hidden" id="loginScreen">
        <div class="login-card">
            <h1>batproxy</h1>
            <div class="sub">authenticated tunnel</div>
            <input type="text" class="key-input" id="apiKeyInput" placeholder="enter your api key" autocomplete="off">
            <button class="login-btn" id="loginBtn">→ access panel</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <div class="bar">
            <div class="logo">batproxy <span>// secure</span></div>
            <div class="user-badge" id="userBadge">
                <span class="dot"></span>
                <span class="username" id="username">loading...</span>
            </div>
        </div>

        <div class="main-panel">
            <div class="left-panel">
                <div>
                    <div class="section-label">01 · select country</div>
                    
                    <!-- Country Grid with Photos -->
                    <div class="country-grid" id="countryGrid"></div>

                    <div style="margin-top: 1.5rem;">
                        <div class="info-row"><span>duration</span><span>6 minutes</span></div>
                        <div class="info-row"><span>port range</span><span>10000–49999</span></div>
                    </div>

                    <button class="generate-btn" id="generateBtn" disabled>generate proxy</button>
                </div>
            </div>

            <div class="right-panel">
                <div class="proxy-result" id="proxyResult">
                    <div style="color: #666; text-align: center;">Select a country to begin</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const BASE_URL = 'https://proxy-api-zeta.vercel.app';
        const CSV_URL = 'https://jklm.gay/list.csv'; // Your CSV file

        // State
        let apiKey = '';
        let username = '';
        let countriesData = []; // Array of { name, code, photoUrl }
        let selectedCountry = null;
        let proxyCountries = []; // Countries from proxy API

        // DOM elements
        const loadingScreen = document.getElementById('loadingScreen');
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const loginBtn = document.getElementById('loginBtn');
        const usernameSpan = document.getElementById('username');
        const countryGrid = document.getElementById('countryGrid');
        const generateBtn = document.getElementById('generateBtn');
        const proxyResult = document.getElementById('proxyResult');
        
        // Step elements
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const step4 = document.getElementById('step4');
        const progressFill = document.getElementById('progressFill');
        const loadingStatus = document.getElementById('loadingStatus');

        // Helper: Update loading step
        function updateLoadingStep(step, status) {
            const steps = [step1, step2, step3, step4];
            steps.forEach((s, i) => {
                s.classList.remove('active', 'completed');
                if (i + 1 < step) {
                    s.classList.add('completed');
                    s.querySelector('.step-indicator').textContent = '✓';
                }
            });
            
            const currentStep = steps[step - 1];
            if (currentStep) {
                currentStep.classList.add('active');
                if (step === 4) currentStep.classList.add('completed');
            }
            
            progressFill.style.width = `${(step - 1) * 25}%`;
            loadingStatus.textContent = status;
        }

        // Parse API key (base64) to extract username
        function parseApiKey(key) {
            try {
                const decoded = atob(key);
                const match = decoded.match(/^u-([^-]+)-k-[a-f0-9]+$/);
                return match ? match[1] : 'unknown';
            } catch {
                return 'invalid';
            }
        }

        // Fetch and parse CSV
        async function fetchCountryData() {
            updateLoadingStep(1, 'Downloading country database...');
            
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // Parse CSV (simple parser)
                const lines = csvText.split('\n');
                const headers = lines[0].split(',');
                
                updateLoadingStep(2, 'Processing country photos...');
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    // Handle commas in fields properly (simple approach)
                    const values = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g) || [];
                    if (values.length >= 5) {
                        countriesData.push({
                            name: values[0].replace(/"/g, ''),
                            code: values[1].replace(/"/g, '').toLowerCase(),
                            alpha3: values[2].replace(/"/g, ''),
                            numeric: values[3].replace(/"/g, ''),
                            photoUrl: values[4].replace(/"/g, '')
                        });
                    }
                }
                
                return true;
            } catch (error) {
                console.error('Failed to fetch CSV:', error);
                loadingStatus.textContent = 'Error loading country data';
                return false;
            }
        }

        // Render country grid with photos
        function renderCountryGrid() {
            if (!countriesData.length || !proxyCountries.length) return;
            
            // Filter countries that are available in proxy API
            const availableCountries = countriesData.filter(c => 
                proxyCountries.includes(c.code)
            );
            
            countryGrid.innerHTML = '';
            
            availableCountries.forEach(country => {
                const card = document.createElement('div');
                card.className = 'country-card';
                if (selectedCountry === country.code) {
                    card.classList.add('selected');
                }
                
                card.innerHTML = `
                    <img class="country-photo" src="${country.photoUrl}" alt="" loading="lazy" 
                         onerror="this.style.display='none'">
                    <div class="country-content">
                        <img class="country-flag" src="https://flagcdn.com/w40/${country.code}.png" 
                             alt="" onerror="this.style.display='none'">
                        <span class="country-name">${country.name}</span>
                        <span class="country-code">${country.code.toUpperCase()}</span>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    document.querySelectorAll('.country-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedCountry = country.code;
                    generateBtn.disabled = false;
                });
                
                countryGrid.appendChild(card);
            });
        }

        // Check saved API key
        async function checkSavedKey() {
            updateLoadingStep(3, 'Checking for saved API key...');
            
            const savedKey = getCookie('batproxy_apikey');
            if (!savedKey) {
                updateLoadingStep(4, 'No saved key - showing login');
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    loginScreen.classList.remove('hidden');
                }, 500);
                return false;
            }
            
            updateLoadingStep(4, 'Validating saved credentials...');
            apiKey = savedKey;
            username = parseApiKey(apiKey);
            
            // Validate by fetching countries
            try {
                const response = await fetch(`${BASE_URL}/proxy/countries`, {
                    headers: { 'x-api-key': apiKey }
                });
                
                if (!response.ok) throw new Error('Invalid key');
                
                const data = await response.json();
                proxyCountries = data.countries || [];
                
                usernameSpan.textContent = username;
                
                // Render the grid
                renderCountryGrid();
                
                // Hide loading, show dashboard
                loadingScreen.style.display = 'none';
                dashboard.style.display = 'flex';
                
                return true;
            } catch (error) {
                console.error('Key validation failed:', error);
                updateLoadingStep(4, 'Key invalid - please login again');
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    loginScreen.classList.remove('hidden');
                }, 1000);
                return false;
            }
        }

        // Cookie helpers
        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        // Login handler
        loginBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) return alert('Enter API key');
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Validating...';
            
            try {
                const response = await fetch(`${BASE_URL}/proxy/countries`, {
                    headers: { 'x-api-key': key }
                });
                
                if (!response.ok) throw new Error('Invalid key');
                
                const data = await response.json();
                proxyCountries = data.countries || [];
                
                apiKey = key;
                username = parseApiKey(key);
                
                setCookie('batproxy_apikey', key, 7);
                
                usernameSpan.textContent = username;
                renderCountryGrid();
                
                loginScreen.classList.add('hidden');
                dashboard.style.display = 'flex';
            } catch (error) {
                alert('Invalid API key');
                loginBtn.disabled = false;
                loginBtn.textContent = '→ access panel';
            }
        });

        // Generate proxy
        generateBtn.addEventListener('click', async () => {
            if (!selectedCountry) return alert('Select a country');
            
            const port = Math.floor(Math.random() * (49999 - 10000 + 1)) + 10000;
            
            proxyResult.innerHTML = `<div style="color: #666; text-align: center;">Generating proxy...</div>`;
            
            try {
                const response = await fetch(`${BASE_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey
                    },
                    body: JSON.stringify({
                        port: port,
                        countrycode: selectedCountry,
                        duration: 6
                    })
                });
                
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error('Generation failed');
                
                // Fetch IP details
                const geoResponse = await fetch(`https://maxmind.api.iii.vg/?ip=${data.ip}`);
                const geo = await geoResponse.json();
                
                // Find country photo
                const countryInfo = countriesData.find(c => c.code === selectedCountry);
                
                proxyResult.innerHTML = `
                    <div class="proxy-port-large">${data.port}</div>
                    <div class="proxy-ip-small">${data.ip}</div>
                    <div class="divider-light"></div>
                    <div class="geo-grid">
                        <div class="geo-item">
                            <span class="geo-label">country</span>
                            <span class="geo-value">
                                <img class="flag-mini" src="https://flagcdn.com/w40/${selectedCountry}.png" alt="">
                                ${geo?.country?.name || 'Unknown'} <small>${selectedCountry.toUpperCase()}</small>
                            </span>
                        </div>
                        <div class="geo-item">
                            <span class="geo-label">ISP</span>
                            <span class="geo-value">${geo?.asn?.organization || 'Unknown'}</span>
                        </div>
                        <div class="geo-item">
                            <span class="geo-label">city</span>
                            <span class="geo-value">${geo?.city?.name || 'Unknown'}</span>
                        </div>
                        <div class="geo-item">
                            <span class="geo-label">duration</span>
                            <span class="geo-value">6 minutes</span>
                        </div>
                    </div>
                `;
            } catch (error) {
                proxyResult.innerHTML = `<div class="error-message">Error: ${error.message}</div>`;
            }
        });

        // Initialize
        async function init() {
            // Show loading screen
            loadingScreen.style.display = 'flex';
            loginScreen.classList.add('hidden');
            dashboard.style.display = 'none';
            
            // Step 1-2: Fetch and process CSV
            const csvSuccess = await fetchCountryData();
            if (!csvSuccess) {
                loadingStatus.textContent = 'Failed to load country data - using fallback';
            }
            
            // Step 3-4: Check for saved key
            await checkSavedKey();
        }

        // Start the app
        init();
    })();
</script>
</body>
</html>
