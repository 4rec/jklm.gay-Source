<!DOCTYPE html>
<html>
<head>
    <title>Proxy API Tester</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        input, button, select { padding: 8px; margin: 5px 0; width: 100%; }
        .card { border: 1px solid #ccc; padding: 15px; margin: 15px 0; border-radius: 5px; }
        .response { background: #f4f4f4; padding: 10px; border-radius: 3px; font-family: monospace; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
    </style>
</head>
<body>
    <h2>Proxy API Tester</h2>
    
    <div class="card">
        <h3>API Key</h3>
        <input type="text" id="apiKey" placeholder="Enter your API key" value="test-key-123">
        <small>For key generation, use master key field below</small>
    </div>

    <div class="card">
        <h3>1. Test Root</h3>
        <button onclick="testRoot()">GET /</button>
        <div id="rootResponse" class="response"></div>
    </div>

    <div class="card">
        <h3>2. Get Countries</h3>
        <button onclick="testCountries()">GET /proxy/countries</button>
        <div id="countriesResponse" class="response"></div>
    </div>

    <div class="card">
        <h3>3. Validate Key</h3>
        <input type="text" id="validateKey" placeholder="Key to validate" value="test-key">
        <button onclick="testValidateKey()">POST /key/validate</button>
        <div id="validateResponse" class="response"></div>
    </div>

    <div class="card">
        <h3>4. Generate New Key (Requires Master Key)</h3>
        <input type="text" id="masterKey" placeholder="Master key" value="your-master-key-here">
        <input type="text" id="username" placeholder="Username" value="testuser">
        <button onclick="testGenerateKey()">POST /key/generate</button>
        <div id="generateResponse" class="response"></div>
    </div>

    <div class="card">
        <h3>5. Check Port</h3>
        <div class="row">
            <input type="number" id="checkPort" placeholder="Port number" value="10001" min="1" max="65535">
        </div>
        <button onclick="testCheckPort()">POST /checkport</button>
        <div id="checkPortResponse" class="response"></div>
    </div>

    <div class="card">
        <h3>6. Generate Proxy</h3>
        <p>Port: random 10001-49999 | Country: BS</p>
        <button onclick="testGenerateProxy()">POST /generate</button>
        <div id="proxyResponse" class="response"></div>
    </div>

    <script>
        const BASE_URL = 'https://proxy-api-zeta.vercel.app';

        async function apiCall(endpoint, options = {}) {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}`, options);
                const text = await res.text();
                try {
                    return { ok: res.ok, data: JSON.parse(text), status: res.status };
                } catch {
                    return { ok: res.ok, data: text, status: res.status };
                }
            } catch (err) {
                return { ok: false, error: err.message };
            }
        }

        function displayResponse(elementId, result) {
            const el = document.getElementById(elementId);
            if (result.error) {
                el.innerHTML = `<span class="error">Error: ${result.error}</span>`;
            } else {
                const status = result.status ? `Status: ${result.status}\n\n` : '';
                el.innerHTML = `<span class="${result.ok ? 'success' : 'error'}">${status}${JSON.stringify(result.data, null, 2)}</span>`;
            }
        }

        async function testRoot() {
            const result = await apiCall('/');
            displayResponse('rootResponse', result);
        }

        async function testCountries() {
            const apiKey = document.getElementById('apiKey').value;
            const result = await apiCall('/proxy/countries', {
                headers: { 'x-api-key': apiKey }
            });
            displayResponse('countriesResponse', result);
        }

        async function testValidateKey() {
            const key = document.getElementById('validateKey').value;
            const result = await apiCall('/key/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 'auth-key': key })
            });
            displayResponse('validateResponse', result);
        }

        async function testGenerateKey() {
            const masterKey = document.getElementById('masterKey').value;
            const username = document.getElementById('username').value;
            
            const result = await apiCall('/key/generate', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': masterKey
                },
                body: JSON.stringify({ username: username })
            });
            displayResponse('generateResponse', result);
            
            if (result.ok && result.data.apikey) {
                document.getElementById('apiKey').value = result.data.apikey;
            }
        }

        async function testCheckPort() {
            const port = document.getElementById('checkPort').value;
            
            const result = await apiCall('/checkport', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ port: parseInt(port) })
            });
            displayResponse('checkPortResponse', result);
        }

        async function testGenerateProxy() {
            const apiKey = document.getElementById('apiKey').value;
            const port = Math.floor(Math.random() * (49999 - 10001 + 1)) + 10001;
            
            const result = await apiCall('/generate', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey
                },
                body: JSON.stringify({
                    port: port,
                    countrycode: 'BS',
                    duration: 300
                })
            });
            displayResponse('proxyResponse', result);
        }

        document.getElementById('masterKey').placeholder = 'Enter master key from code';
    </script>
</body>
</html>
