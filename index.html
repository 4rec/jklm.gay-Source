<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy API · Terminal</title>
    <style>
        /* AMOLED Black & White Theme - Coder Aesthetic */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
            font-size: 14px;
            padding: 16px;
        }

        .terminal-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Login Screen */
        .login-screen {
            max-width: 420px;
            margin: 0 auto;
            border: 1px solid #333;
            background: #0a0a0a;
            padding: 32px;
            box-shadow: 0 0 20px rgba(255,255,255,0.03);
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #fff;
        }

        .header .sub {
            color: #666;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            padding: 12px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #fff;
        }

        .input-group input::placeholder {
            color: #333;
        }

        .btn {
            width: 100%;
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #333;
        }

        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-top: 8px;
            min-height: 20px;
        }

        /* Dashboard (hidden by default) */
        .dashboard {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }

        .api-key-display {
            background: #0a0a0a;
            padding: 8px 16px;
            border: 1px solid #333;
            font-size: 12px;
            color: #0f0;
        }

        .api-key-display span {
            color: #666;
            margin-right: 8px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: #fff;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 20px;
        }

        .stat-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 300;
        }

        /* Country Grid */
        .country-section {
            margin-bottom: 32px;
        }

        .section-title {
            margin-bottom: 16px;
            color: #fff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title::before {
            content: '> ';
            color: #666;
        }

        .country-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 4px;
            border: 1px solid #333;
            background: #0a0a0a;
        }

        .country-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s;
            background: #000;
        }

        .country-item:hover {
            border-color: #fff;
        }

        .country-item.selected {
            border-color: #fff;
            background: #111;
        }

        .country-flag {
            width: 24px;
            height: 18px;
            object-fit: cover;
        }

        .country-name {
            font-size: 12px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ports Section */
        .ports-section {
            margin-top: 24px;
        }

        .generate-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 200px;
            margin: 24px 0;
        }

        .ports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .port-card {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 16px;
        }

        .port-country {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .port-number {
            font-size: 20px;
            font-weight: 300;
            color: #0f0;
        }

        .port-status {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .proxy-string {
            background: #000;
            padding: 8px;
            margin-top: 8px;
            font-size: 11px;
            color: #666;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s;
            word-break: break-all;
        }

        .proxy-string:hover {
            border-color: #fff;
            color: #fff;
        }

        /* Loading Spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border: 1px solid #000;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 10px;
            border: 1px solid currentColor;
            margin-left: 8px;
        }

        .status-badge.online {
            color: #0f0;
            border-color: #0f0;
        }

        .status-badge.offline {
            color: #f00;
            border-color: #f00;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <div class="header">
                <h1>PROXY API v1.0</h1>
                <div class="sub">AUTHENTICATION REQUIRED</div>
            </div>
            
            <div class="input-group">
                <label>API KEY</label>
                <input type="text" id="apiKeyInput" placeholder="Enter your API key" autocomplete="off">
            </div>
            
            <button class="btn" id="loginBtn">AUTHENTICATE</button>
            <div class="error-message" id="loginError"></div>
            
            <div style="margin-top: 24px; text-align: center; color: #333; font-size: 11px;">
                Need a key? Contact administrator
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <div class="dashboard-header">
                <div class="api-key-display">
                    <span>API KEY:</span> <span id="currentApiKey"></span>
                </div>
                <button class="logout-btn" id="logoutBtn">LOGOUT</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Generated Ports</div>
                    <div class="stat-value" id="portCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Selected Countries</div>
                    <div class="stat-value" id="selectedCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="apiStatus">● Online</div>
                </div>
            </div>

            <div class="country-section">
                <div class="section-title">SELECT COUNTRIES</div>
                <div class="country-grid" id="countryGrid"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button class="btn generate-btn" id="generateBtn" disabled>
                    <span>GENERATE PORTS</span>
                    <span class="loading" id="generateLoading" style="display: none;"></span>
                </button>
                <div id="generateError" style="color: #ff4444; font-size: 12px;"></div>
            </div>

            <div class="ports-section">
                <div class="section-title">ACTIVE PORTS</div>
                <div class="ports-grid" id="portsGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://proxy-api-zeta.vercel.app';
        let apiKey = localStorage.getItem('proxy_api_key') || '';
        let selectedCountries = new Set();
        let ports = JSON.parse(localStorage.getItem('proxy_ports') || '[]');
        let countryData = [];
        let countryCodes = {};

        // Load country codes and data
        async function loadCountryData() {
            try {
                // Load flag codes
                const flagsRes = await fetch('https://flagcdn.com/en/codes.json');
                countryCodes = await flagsRes.json();
                
                // Load lat/long data
                const geoRes = await fetch('https://raw.githubusercontent.com/eesur/country-codes-lat-long/master/country-codes-lat-long-alpha3.json');
                const geoData = await geoRes.json();
                
                // Combine data
                countryData = Object.entries(countryCodes).map(([code, name]) => {
                    const geo = geoData.ref_country_codes.find(c => 
                        c.alpha2.toLowerCase() === code.toLowerCase()
                    );
                    return {
                        code: code,
                        name: name,
                        alpha2: code.toUpperCase(),
                        alpha3: geo?.alpha3 || '',
                        latitude: geo?.latitude || 0,
                        longitude: geo?.longitude || 0
                    };
                }).sort((a, b) => a.name.localeCompare(b.name));
                
                renderCountryGrid();
            } catch (error) {
                console.error('Failed to load country data:', error);
            }
        }

        // Render country grid
        function renderCountryGrid() {
            const grid = document.getElementById('countryGrid');
            grid.innerHTML = '';
            
            countryData.forEach(country => {
                const item = document.createElement('div');
                item.className = `country-item ${selectedCountries.has(country.code) ? 'selected' : ''}`;
                item.onclick = () => toggleCountry(country.code);
                
                item.innerHTML = `
                    <img class="country-flag" src="https://flagcdn.com/w40/${country.code}.png" alt="${country.name} flag" loading="lazy">
                    <span class="country-name" title="${country.name}">${country.name}</span>
                `;
                
                grid.appendChild(item);
            });
            
            updateSelectedCount();
        }

        // Toggle country selection
        function toggleCountry(countryCode) {
            if (selectedCountries.has(countryCode)) {
                selectedCountries.delete(countryCode);
            } else {
                selectedCountries.add(countryCode);
            }
            
            renderCountryGrid();
            document.getElementById('generateBtn').disabled = selectedCountries.size === 0;
        }

        // Update selected countries count
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedCountries.size;
        }

        // Update ports display
        function updatePortsDisplay() {
            const portsGrid = document.getElementById('portsGrid');
            const portCount = document.getElementById('portCount');
            
            portCount.textContent = ports.length;
            
            if (ports.length === 0) {
                portsGrid.innerHTML = '<div style="color: #666; grid-column: 1/-1; text-align: center; padding: 40px;">No active ports. Generate some ports to get started.</div>';
                return;
            }
            
            portsGrid.innerHTML = ports.map(port => {
                const proxyString = `http://user-sp7xvy593n-country-${port.country}-sessionduration-60:xKs+vS69cmdJg1Vho3@gate.decodo.com:${port.port}`;
                
                return `
                    <div class="port-card">
                        <div class="port-country">
                            <img class="country-flag" src="https://flagcdn.com/w40/${port.country}.png" alt="${port.country} flag">
                            <span>${countryCodes[port.country] || port.country}</span>
                        </div>
                        <div class="port-number">${port.port}</div>
                        <div class="port-status">Generated: ${new Date(port.timestamp).toLocaleString()}</div>
                        <div class="proxy-string" onclick="copyToClipboard('${proxyString}')" title="Click to copy">${proxyString}</div>
                    </div>
                `;
            }).join('');
        }

        // Copy to clipboard
        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).then(() => {
                // Optional: show feedback
                console.log('Copied to clipboard');
            });
        };

        // Validate API key
        async function validateApiKey(key) {
            try {
                const response = await fetch(`${API_BASE}/key/validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': key
                    },
                    body: JSON.stringify({ key: key })
                });
                
                const data = await response.json();
                return data.success || false;
            } catch (error) {
                console.error('Validation error:', error);
                return false;
            }
        }

        // Generate ports
        async function generatePorts() {
            const generateBtn = document.getElementById('generateBtn');
            const generateLoading = document.getElementById('generateLoading');
            const generateError = document.getElementById('generateError');
            
            generateBtn.disabled = true;
            generateLoading.style.display = 'inline-block';
            generateError.textContent = '';
            
            try {
                const countries = Array.from(selectedCountries);
                const newPorts = [];
                
                for (const country of countries) {
                    const response = await fetch(`${API_BASE}/proxy/generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey
                        },
                        body: JSON.stringify({ country: country })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success && data.port) {
                        newPorts.push({
                            port: data.port,
                            country: country,
                            timestamp: Date.now()
                        });
                    }
                }
                
                if (newPorts.length > 0) {
                    ports = [...newPorts, ...ports].slice(0, 50); // Keep last 50 ports
                    localStorage.setItem('proxy_ports', JSON.stringify(ports));
                    updatePortsDisplay();
                }
                
            } catch (error) {
                generateError.textContent = 'Failed to generate ports. Please try again.';
                console.error('Generation error:', error);
            } finally {
                generateBtn.disabled = false;
                generateLoading.style.display = 'none';
            }
        }

        // Login handler
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const input = document.getElementById('apiKeyInput');
            const error = document.getElementById('loginError');
            const key = input.value.trim();
            
            if (!key) {
                error.textContent = 'API key is required';
                return;
            }
            
            document.getElementById('loginBtn').disabled = true;
            error.textContent = '';
            
            const isValid = await validateApiKey(key);
            
            if (isValid) {
                apiKey = key;
                localStorage.setItem('proxy_api_key', key);
                document.getElementById('currentApiKey').textContent = key.substring(0, 8) + '...';
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
                // Load saved selections
                const savedSelected = localStorage.getItem('selected_countries');
                if (savedSelected) {
                    selectedCountries = new Set(JSON.parse(savedSelected));
                }
                
                renderCountryGrid();
                updatePortsDisplay();
                document.getElementById('generateBtn').disabled = selectedCountries.size === 0;
            } else {
                error.textContent = 'Invalid API key';
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', () => {
            apiKey = '';
            localStorage.removeItem('proxy_api_key');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('apiKeyInput').value = '';
        });

        // Generate button handler
        document.getElementById('generateBtn').addEventListener('click', generatePorts);

        // Enter key handler for login
        document.getElementById('apiKeyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });

        // Save selections to localStorage when changed
        function saveSelections() {
            localStorage.setItem('selected_countries', JSON.stringify(Array.from(selectedCountries)));
        }

        // Override toggleCountry to save selections
        const originalToggleCountry = toggleCountry;
        toggleCountry = (code) => {
            originalToggleCountry(code);
            saveSelections();
        };

        // Initialize
        (async () => {
            await loadCountryData();
            
            // Auto-login if key exists
            if (apiKey) {
                document.getElementById('apiKeyInput').value = apiKey;
                document.getElementById('loginBtn').click();
            }
        })();
    </script>
</body>
</html>
