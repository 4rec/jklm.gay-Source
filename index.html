<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatProxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e5e5;
        }

        .app {
            width: 680px;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* key section */
        .key-section {
            background: #0f0f0f;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .label {
            font-size: 12px;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .key-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .key-input-row input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: #fff;
            outline: none;
        }

        .key-input-row input:focus {
            border-color: #4a4a4a;
            background: #202020;
        }

        .key-input-row button {
            background: #252525;
            border: 1px solid #363636;
            border-radius: 8px;
            padding: 0 20px;
            color: #d4d4d4;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
        }

        .key-input-row button:hover {
            background: #2f2f2f;
            border-color: #4a4a4a;
            color: #fff;
        }

        .status-text {
            font-size: 12px;
            color: #6a6a6a;
        }

        .status-text.success {
            color: #8bc34a;
        }

        .status-text.error {
            color: #ef5350;
        }

        /* main ui */
        .main-ui {
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .main-ui.active {
            opacity: 1;
            pointer-events: all;
        }

        /* loading overlay */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 0;
            color: #6a6a6a;
            font-size: 14px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid #252525;
            border-top-color: #6a6a6a;
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* country selector */
        .country-section {
            background: #0f0f0f;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .select-wrapper {
            position: relative;
            margin-top: 8px;
        }

        select {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: #fff;
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        select option {
            background: #1a1a1a;
            color: #fff;
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #5a5a5a;
            font-size: 12px;
            pointer-events: none;
        }

        .country-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .country-count {
            font-size: 12px;
            color: #6a6a6a;
        }

        .refresh-btn {
            background: none;
            border: none;
            color: #7a7a7a;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .refresh-btn:hover {
            color: #aaa;
            background: #1a1a1a;
        }

        /* generate section */
        .generate-section {
            background: #0f0f0f;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 20px;
        }

        .generate-btn {
            width: 100%;
            background: #252525;
            border: 1px solid #363636;
            border-radius: 8px;
            padding: 14px;
            color: #d4d4d4;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            margin-bottom: 16px;
        }

        .generate-btn:hover:not(:disabled) {
            background: #2f2f2f;
            border-color: #4a4a4a;
            color: #fff;
        }

        .generate-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* result panel */
        .result-panel {
            background: #0a0a0a;
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 16px;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .result-ip {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
        }

        .result-port {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #aaa;
            border: 1px solid #2a2a2a;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .result-item {
            background: #0f0f0f;
            border: 1px solid #202020;
            border-radius: 6px;
            padding: 10px;
        }

        .result-item .label {
            font-size: 10px;
            margin-bottom: 4px;
        }

        .result-item .value {
            font-size: 13px;
            color: #fff;
            font-weight: 500;
        }

        .error-box {
            background: #1c0f0f;
            border: 1px solid #3a2222;
            border-radius: 6px;
            padding: 12px;
            color: #ef5350;
            font-size: 13px;
            margin-bottom: 16px;
        }

        hr {
            border: none;
            border-top: 1px solid #1f1f1f;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- key section - always visible -->
        <div class="key-section">
            <div class="label">API KEY</div>
            <div class="key-input-row">
                <input type="text" id="apiKey" placeholder="Enter your API key" value="test-key-123">
                <button id="saveKey">Save</button>
            </div>
            <div id="keyStatus" class="status-text">💾 Key saved to cookies</div>
        </div>

        <!-- loading indicator -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading countries...</div>
        </div>

        <!-- main UI (hidden until key is valid) -->
        <div id="mainUi" class="main-ui">
            <!-- country selector -->
            <div class="country-section">
                <div class="label">COUNTRY</div>
                <div class="select-wrapper">
                    <select id="countrySelect">
                        <option value="">Select a country</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
                <div class="country-footer">
                    <span id="countryCount" class="country-count">0 countries</span>
                    <button id="refreshCountries" class="refresh-btn">Refresh</button>
                </div>
            </div>

            <!-- generate section -->
            <div class="generate-section">
                <button id="generateBtn" class="generate-btn" disabled>Generate proxy</button>
                
                <!-- error display -->
                <div id="errorDisplay" class="error-box" style="display: none;"></div>
                
                <!-- result panel -->
                <div id="resultPanel" class="result-panel" style="display: none;">
                    <div class="result-header">
                        <span id="resultIp" class="result-ip">-</span>
                        <span id="resultPort" class="result-port">port: -</span>
                    </div>
                    <div class="result-grid" id="resultGrid">
                        <!-- filled dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const apiKeyInput = document.getElementById('apiKey');
            const saveKeyBtn = document.getElementById('saveKey');
            const keyStatus = document.getElementById('keyStatus');
            const loading = document.getElementById('loading');
            const mainUi = document.getElementById('mainUi');
            const countrySelect = document.getElementById('countrySelect');
            const countryCount = document.getElementById('countryCount');
            const refreshBtn = document.getElementById('refreshCountries');
            const generateBtn = document.getElementById('generateBtn');
            const errorDisplay = document.getElementById('errorDisplay');
            const resultPanel = document.getElementById('resultPanel');
            const resultIp = document.getElementById('resultIp');
            const resultPort = document.getElementById('resultPort');
            const resultGrid = document.getElementById('resultGrid');

            // Constants
            const BASE_URL = 'https://proxy-api-zeta.vercel.app';
            const FLAG_CODES_URL = 'https://flagcdn.com/en/codes.json';
            const IP_LOOKUP_BASE = 'https://nyanc4tt.xyz/api/iplookup?ip=';

            // State
            let availableCountries = [];
            let countryNames = {};
            let currentApiKey = '';

            // Cookie functions
            function setCookie(name, value, days = 30) {
                const d = new Date();
                d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
                document.cookie = `${name}=${encodeURIComponent(value)}; path=/; SameSite=Lax; expires=${d.toUTCString()}`;
            }

            function getCookie(name) {
                const cookies = document.cookie.split('; ');
                for (let c of cookies) {
                    const [key, val] = c.split('=');
                    if (key === name) return decodeURIComponent(val);
                }
                return null;
            }

            // Load saved key
            const savedKey = getCookie('batproxy_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                keyStatus.textContent = '✓ Key loaded from cookie';
                keyStatus.className = 'status-text success';
                validateAndLoad(savedKey);
            }

            // Save key
            saveKeyBtn.addEventListener('click', () => {
                const key = apiKeyInput.value.trim();
                if (key) {
                    setCookie('batproxy_key', key);
                    keyStatus.textContent = '✓ Key saved';
                    keyStatus.className = 'status-text success';
                    validateAndLoad(key);
                }
            });

            // Validate key and load countries
            async function validateAndLoad(key) {
                if (!key) return;
                
                currentApiKey = key;
                
                // Show loading, hide main UI
                loading.classList.add('active');
                mainUi.classList.remove('active');
                errorDisplay.style.display = 'none';
                resultPanel.style.display = 'none';
                
                try {
                    // Fetch both country list and flag names
                    const [countries, flags] = await Promise.all([
                        fetch(`${BASE_URL}/proxy/countries`, {
                            headers: { 'x-api-key': key }
                        }).then(res => {
                            if (!res.ok) throw new Error('Invalid API key');
                            return res.json();
                        }),
                        fetch(FLAG_CODES_URL).then(res => res.json())
                    ]);
                    
                    availableCountries = countries.countries.map(c => c.toLowerCase());
                    countryNames = flags;
                    
                    // Populate dropdown
                    populateDropdown();
                    
                    // Enable main UI
                    mainUi.classList.add('active');
                    generateBtn.disabled = false;
                    
                } catch (err) {
                    keyStatus.textContent = '✗ Failed to load countries - invalid key?';
                    keyStatus.className = 'status-text error';
                    generateBtn.disabled = true;
                } finally {
                    loading.classList.remove('active');
                }
            }

            // Populate country dropdown
            function populateDropdown() {
                const validCountries = availableCountries
                    .filter(code => countryNames[code])
                    .map(code => ({
                        code,
                        name: countryNames[code]
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name));

                let html = '<option value="">Select a country</option>';
                validCountries.forEach(c => {
                    html += `<option value="${c.code}">${c.name}</option>`;
                });
                
                countrySelect.innerHTML = html;
                countryCount.textContent = `${validCountries.length} countries`;
            }

            // Refresh countries
            refreshBtn.addEventListener('click', () => {
                if (currentApiKey) validateAndLoad(currentApiKey);
            });

            // Enable generate when country selected
            countrySelect.addEventListener('change', () => {
                generateBtn.disabled = !countrySelect.value;
            });

            // Generate proxy
            generateBtn.addEventListener('click', async () => {
                const country = countrySelect.value;
                if (!country) return;

                const port = Math.floor(Math.random() * (49999 - 10000 + 1)) + 10000;
                
                generateBtn.disabled = true;
                generateBtn.textContent = 'Generating...';
                errorDisplay.style.display = 'none';
                
                try {
                    // Generate proxy
                    const genRes = await fetch(`${BASE_URL}/generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': currentApiKey
                        },
                        body: JSON.stringify({
                            port,
                            countrycode: country,
                            duration: 6
                        })
                    });

                    if (!genRes.ok) throw new Error('Generation failed');
                    
                    const genData = await genRes.json();
                    if (!genData.success) throw new Error('Generation failed');

                    // Get IP info
                    const ipRes = await fetch(`${IP_LOOKUP_BASE}${genData.ip}`);
                    const ipInfo = await ipRes.json();

                    // Display results
                    displayResult(genData.ip, genData.port, ipInfo);
                    
                } catch (err) {
                    errorDisplay.textContent = `Error: ${err.message}`;
                    errorDisplay.style.display = 'block';
                    resultPanel.style.display = 'none';
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate proxy';
                }
            });

            // Display result
            function displayResult(ip, port, info) {
                resultIp.textContent = ip;
                resultPort.textContent = `port: ${port}`;
                
                const fields = [
                    { label: 'COUNTRY', value: info.country || '-' },
                    { label: 'CITY', value: info.city || '-' },
                    { label: 'ISP', value: info.isp || '-' },
                    { label: 'REGION', value: info.region || '-' },
                    { label: 'ASN', value: info.asn || '-' },
                    { label: 'CONTINENT', value: info.continent || '-' }
                ];
                
                resultGrid.innerHTML = fields.map(f => `
                    <div class="result-item">
                        <div class="label">${f.label}</div>
                        <div class="value">${f.value}</div>
                    </div>
                `).join('');
                
                resultPanel.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
